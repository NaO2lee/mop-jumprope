<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>심판+카메라 — 모두의 플레이</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050810;--sur:#0d1117;--sur2:#161b24;
  --ac:#00e5ff;--ac2:#ff3d71;--gn:#00ff88;--yw:#ffd60a;
  --tx:#e8eaf2;--mu:#4a5568;--mu2:#718096;
  --fold:50vh;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;}

/* ── 설정 화면 ── */
#s-setup{display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;min-height:100dvh;background:radial-gradient(ellipse at 30% 20%,#0a1628,var(--bg) 60%);}
#s-setup.show{display:flex;}
.logo-txt{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:.4em;color:var(--mu);}
.big-title{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--ac);letter-spacing:.06em;line-height:1;}
.sub-txt{font-size:11px;color:var(--mu2);text-align:center;line-height:1.6;}
.card{width:100%;max-width:350px;background:var(--sur2);border:1.5px solid #1e2535;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-size:10px;color:var(--mu2);letter-spacing:.1em;text-transform:uppercase;}
.inp{background:#080b12;border:1.5px solid #1e2535;border-radius:11px;padding:12px 14px;font-size:16px;color:var(--tx);font-family:'Noto Sans KR',sans-serif;outline:none;width:100%;transition:border-color .2s;}
.inp:focus{border-color:var(--ac);}
.inp-mono{font-family:monospace;letter-spacing:.05em;}
.big-btn{width:100%;padding:15px;border:none;border-radius:13px;font-size:16px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;letter-spacing:.02em;}
.big-btn:active{transform:scale(.97);}
.btn-ac{background:var(--ac);color:#000;}

/* ── 모드 선택 ── */
.mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.mode-btn{padding:12px 8px;border:1.5px solid #1e2535;border-radius:12px;background:var(--sur);color:var(--tx);cursor:pointer;text-align:center;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.mode-btn.active{border-color:var(--ac);background:rgba(0,229,255,.12);color:var(--ac);}
.mode-btn .mode-icon{font-size:22px;display:block;margin-bottom:4px;}
.mode-btn .mode-lbl{font-size:11px;font-weight:700;}
.mode-btn .mode-desc{font-size:9px;color:var(--mu2);margin-top:2px;}

/* ── 메인 화면 (분할) ── */
#s-main{display:none;flex-direction:column;height:100dvh;overflow:hidden;}
#s-main.show{display:flex;}

/* ─ 카메라 영역 ─ */
#cam-panel{position:relative;height:var(--fold);flex-shrink:0;background:#000;overflow:hidden;transition:height .3s;}
#cam-panel.hidden{height:0;}
#cam-video{width:100%;height:100%;object-fit:cover;display:block;}
.cam-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;}
.cam-top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 14px 0;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);padding-bottom:28px;}
.cam-info{display:flex;flex-direction:column;gap:2px;}
.cam-room{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.12em;}
.cam-court{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--ac);line-height:1;text-shadow:0 0 20px rgba(0,229,255,.5);}
.cam-athlete{font-size:12px;font-weight:700;}
.cam-status{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.65);border-radius:20px;padding:5px 10px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);pointer-events:auto;}
.cam-dot{width:6px;height:6px;border-radius:50%;}
.cam-dot.live{background:var(--ac2);animation:pls .7s ease-in-out infinite alternate;}
.cam-dot.conn{background:var(--ac);animation:pls .6s ease-in-out infinite alternate;}
.cam-dot.off{background:var(--mu);}
@keyframes pls{from{opacity:.3;}to{opacity:1;}}
.cam-bot{display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px 14px;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);padding-top:28px;pointer-events:auto;}
.cam-count{font-family:'Bebas Neue',sans-serif;font-size:60px;line-height:1;color:#fff;transition:color .1s;text-shadow:0 0 30px rgba(255,255,255,.2);}
.cam-count.flash{color:var(--ac);}
.cam-btns{display:flex;gap:8px;}
.cam-btn{width:40px;height:40px;border:1.5px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(0,0,0,.6);color:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cam-btn:active{transform:scale(.9);}

/* 경첩선 */
#fold-line{height:3px;background:linear-gradient(90deg,transparent,rgba(0,229,255,.4),var(--ac),rgba(0,229,255,.4),transparent);flex-shrink:0;display:none;position:relative;}
#fold-line.show{display:block;}
#fold-line::after{content:'· MOP ·';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Bebas Neue',sans-serif;font-size:9px;letter-spacing:.3em;color:rgba(0,229,255,.5);background:var(--bg);padding:0 8px;}

/* ─ 심판 영역 ─ */
#judge-panel{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;min-height:0;}
#judge-panel.full{flex:1;}

/* 히트+선수 정보 바 */
.info-bar{background:var(--sur2);border-bottom:1px solid #1e2535;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.heat-badge{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--ac);background:rgba(0,229,255,.1);padding:3px 8px;border-radius:5px;border:1px solid rgba(0,229,255,.3);white-space:nowrap;}
.event-info{flex:1;min-width:0;}
.event-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.event-div{font-size:10px;color:var(--mu2);}
.fb-dot{font-size:9px;color:var(--mu2);}

/* 선수 정보 */
.athlete-bar{background:rgba(0,229,255,.04);border-bottom:1px solid rgba(0,229,255,.1);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.ath-bib{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--ac);flex-shrink:0;line-height:1;}
.ath-info{flex:1;min-width:0;}
.ath-name{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ath-club{font-size:10px;color:var(--mu2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 카운트 영역 */
.count-area{flex:1;display:flex;flex-direction:column;padding:8px 16px;gap:8px;}
.c-btn{border:none;border-radius:14px;font-family:'Bebas Neue',sans-serif;cursor:pointer;transition:all .1s;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0;font-size:30px;user-select:none;}
.c-btn:active{transform:scale(.93);filter:brightness(1.3);}
/* +1 전체 채우기 버튼 */
.c-big{flex:1;width:100%;font-size:clamp(60px,18vw,100px);border-radius:20px;padding:0;}
.c-lbl{font-size:10px;margin-top:2px;opacity:.7;font-family:'Noto Sans KR',sans-serif;font-weight:700;}
.c-minus{background:rgba(255,61,113,.15);color:var(--ac2);border:1.5px solid rgba(255,61,113,.3);}
.c-plus1{background:rgba(0,229,255,.12);color:var(--ac);border:1.5px solid rgba(0,229,255,.3);}
.c-plus5{background:rgba(0,255,136,.1);color:var(--gn);border:1.5px solid rgba(0,255,136,.25);}

/* 액션 바 */
.action-bar{display:flex;gap:7px;padding:8px 14px;padding-bottom:max(8px,env(safe-area-inset-bottom));flex-shrink:0;border-top:1px solid #1e2535;}
.act-btn{flex:1;padding:13px;border:none;border-radius:13px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;}
.act-btn:active{transform:scale(.97);}
.act-clear{background:var(--sur2);color:var(--mu2);border:1.5px solid #1e2535;}
.act-ready{background:rgba(255,214,10,.15);color:var(--yw);border:1.5px solid rgba(255,214,10,.3);}
.act-ready.on{background:var(--yw);color:#000;}
.act-submit{background:var(--ac);color:#000;}

/* 신호음 플래시 오버레이 */
#sig-flash{position:fixed;inset:0;z-index:200;pointer-events:none;opacity:0;transition:opacity .1s;}
#sig-flash.start{background:rgba(0,229,255,.25);}
#sig-flash.end{background:rgba(255,61,113,.2);}
#sig-flash.show{opacity:1;}

/* 제출 완료 오버레이 */
#overlay-done{display:none;position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(10px);}
#overlay-done.show{display:flex;}
.ov-icon{font-size:60px;}
.ov-title{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.06em;}
.ov-sub{font-size:14px;color:var(--mu2);text-align:center;padding:0 20px;}
.ov-btn{padding:14px 32px;border-radius:13px;border:none;font-size:16px;font-weight:700;cursor:pointer;background:var(--ac);color:#000;font-family:'Noto Sans KR',sans-serif;}

/* 상태 표시 바 (상단) */
.status-bar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(0,0,0,.4);border-bottom:1px solid #1e2535;flex-shrink:0;}
.hstate-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:'Noto Sans KR',sans-serif;}
.hstate-idle{background:rgba(74,85,104,.3);color:#718096;}
.hstate-calling{background:rgba(255,214,10,.2);color:var(--yw);}
.hstate-racing{background:rgba(0,229,255,.2);color:var(--ac);}
.hstate-finished{background:rgba(0,255,136,.2);color:var(--gn);}

/* 토스트 */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.3);color:var(--ac);border-radius:20px;padding:10px 20px;font-size:13px;white-space:nowrap;z-index:50;animation:tst .3s ease;pointer-events:none;}
@keyframes tst{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
</style>
</head>
<body>

<!-- ═══════ 설정 화면 ═══════ -->
<div id="s-setup" class="show">
  <div class="logo-txt">모두의 플레이</div>
  <div class="big-title">심판 + 카메라</div>
  <div class="sub-txt">URL 파라미터 자동 인식<br>?room=XXX&court=A&mode=both</div>

  <div class="card">
    <div class="fld">
      <label>📡 Room ID</label>
      <input class="inp inp-mono" id="inp-room" type="text" placeholder="예: room_001">
    </div>
    <div class="fld">
      <label>🏟 코트 번호</label>
      <input class="inp inp-mono" id="inp-court" type="text" placeholder="예: A 또는 1" oninput="this.value=this.value.toUpperCase()">
    </div>
    <div class="fld">
      <label>⚖ 심판 이름</label>
      <input class="inp" id="inp-judge" type="text" placeholder="홍길동">
    </div>
    <div class="fld">
      <label>🎛 모드 선택</label>
      <div class="mode-grid">
        <button class="mode-btn active" id="mode-both" onclick="selectMode('both')">
          <span class="mode-icon">📷⚖</span>
          <span class="mode-lbl">통합</span>
          <span class="mode-desc">Z플립 최적</span>
        </button>
        <button class="mode-btn" id="mode-judge" onclick="selectMode('judge')">
          <span class="mode-icon">⚖</span>
          <span class="mode-lbl">심판만</span>
          <span class="mode-desc">일반 스마트폰</span>
        </button>
        <button class="mode-btn" id="mode-cam" onclick="selectMode('cam')">
          <span class="mode-icon">📷</span>
          <span class="mode-lbl">카메라만</span>
          <span class="mode-desc">전용 송출</span>
        </button>
      </div>
    </div>
    <button class="big-btn btn-ac" onclick="startApp()">🚀 시작</button>
  </div>
</div>

<!-- ═══════ 메인 화면 ═══════ -->
<div id="s-main">

  <!-- 카메라 패널 -->
  <div id="cam-panel">
    <video id="cam-video" playsinline autoplay muted></video>
    <div class="cam-overlay">
      <div class="cam-top">
        <div class="cam-info">
          <div class="cam-room" id="cam-room">ROOM: —</div>
          <div class="cam-court" id="cam-court">C-A</div>
          <div class="cam-athlete" id="cam-athlete"></div>
        </div>
        <div class="cam-status">
          <div class="cam-dot off" id="cam-dot"></div>
          <span id="cam-status-txt" style="font-size:10px;color:rgba(255,255,255,.6)">연결 중...</span>
        </div>
      </div>
      <div class="cam-bot">
        <div>
          <div style="font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.1em;margin-bottom:2px">COUNT</div>
          <div class="cam-count" id="cam-count">0</div>
        </div>
        <div class="cam-btns">
          <div class="cam-btn" onclick="flipCamera()">🔄</div>
          <div class="cam-btn" id="fold-btn" onclick="toggleFold()">↕</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 경첩선 -->
  <div id="fold-line"></div>

  <!-- 심판 패널 -->
  <div id="judge-panel">

    <!-- 히트 상태 바 -->
    <div class="status-bar">
      <div class="hstate-badge hstate-idle" id="hstate-badge">⏸ 대기</div>
      <div style="font-size:10px;color:var(--mu2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="hstate-event">—</div>
      <div class="fb-dot" id="fb-dot">⏳</div>
    </div>

    <!-- 히트+종목 정보 -->
    <div class="info-bar">
      <div class="heat-badge" id="heat-badge">HEAT —</div>
      <div class="event-info">
        <div class="event-name" id="event-name">로딩 중...</div>
        <div class="event-div" id="event-div">—</div>
      </div>
    </div>

    <!-- 선수 정보 -->
    <div class="athlete-bar">
      <div class="ath-bib" id="ath-bib">#—</div>
      <div class="ath-info">
        <div class="ath-name" id="ath-name">선수 대기 중...</div>
        <div class="ath-club" id="ath-club">—</div>
      </div>
    </div>

    <!-- 카운트 메인: 숫자 제거, +1 전체 채우기 -->
    <div class="count-area">
      <!-- +1 큰 버튼이 중앙 전체 차지 -->
      <button class="c-btn c-plus1 c-big"
        onclick="addCount(1)"
        ontouchstart="handleTap(event)">
        +1
        <span class="c-lbl">터치</span>
      </button>
      <!-- 하단 −1 / +10 보조 버튼 -->
      <div class="count-btns">
        <button class="c-btn c-minus" onclick="addCount(-1)">
          −1<span class="c-lbl">빼기</span>
        </button>
        <div style="display:flex;align-items:center;justify-content:center;gap:4px;">
          <span style="font-size:10px;color:var(--mu2);">COUNT</span>
          <span id="count-display-sm" style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--ac);line-height:1;">0</span>
        </div>
        <button class="c-btn c-plus5" onclick="addCount(10)">
          +10<span class="c-lbl">10개</span>
        </button>
      </div>
    </div>

    <!-- 액션 바: 준비완료 + 기록제출 -->
    <div class="action-bar">
      <button class="act-btn act-clear" onclick="clearCount()">🗑 초기화</button>
      <button class="act-btn act-ready" id="btn-ready" onclick="toggleReady()">✋ 준비 완료</button>
      <button class="act-btn act-submit" onclick="submitScore()">✓ 기록 제출</button>
    </div>
  </div>
</div>

<!-- 제출 완료 오버레이 -->
<div id="overlay-done">
  <div class="ov-icon">✅</div>
  <div class="ov-title" id="ov-score">기록 제출</div>
  <div class="ov-sub" id="ov-sub">다음 히트를 기다려 주세요</div>
  <button class="ov-btn" onclick="closeOverlay()">확인</button>
</div>

<!-- 신호음 플래시 -->
<div id="sig-flash"></div>

<script>
// ═══════════ Firebase ═══════════
firebase.initializeApp({
  apiKey:"AIzaSyDOrKZDSNiA4sLnkNBiLVehE8xtrU-2JLY",
  authDomain:"mop-jumprope.firebaseapp.com",
  databaseURL:"https://mop-jumprope-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"mop-jumprope",storageBucket:"mop-jumprope.firebasestorage.app",
  messagingSenderId:"875740425909",appId:"1:875740425909:web:59768e633b7a42733918fc"
});
const db=firebase.database();

// ═══════════ 오디오 ═══════════
let audioCtx=null;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function tone(freq,dur,type='sine',vol=.6,off=0){
  const ctx=getCtx(),osc=ctx.createOscillator(),g=ctx.createGain();
  osc.type=type;osc.frequency.value=freq;osc.connect(g);g.connect(ctx.destination);
  const t=ctx.currentTime+off;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);
  g.gain.linearRampToValueAtTime(vol,t+dur-.05);g.gain.linearRampToValueAtTime(0,t+dur);
  osc.start(t);osc.stop(t+dur);
}
const BEEP={
  start:()=>{tone(880,.12,'sine',.5,0);tone(880,.12,'sine',.5,.35);tone(1320,.6,'sine',.75,.7);},
  end:()=>{tone(440,.9,'sine',.7,0);},
  recall:()=>{for(let i=0;i<4;i++)tone(i%2?880:660,.2,'square',.45,i*.28);},
};

// ═══════════ 상태 변수 ═══════════
let roomId='',courtId='',judgeName='',appMode='both';
let count=0,isReady=false;
let currentHeatNo=1,currentHeat=null;
let localStream=null,facingMode='environment';
let peer=null,currentCall=null,retryTimer=null;
let lastSignalTs=0;
let lastHeatChangeTs=0;
const FOLD_STEPS=[30,40,50,60,70];
let foldIdx=2;

// ═══════════ URL 파라미터 자동 인식 ═══════════
(function(){
  const p=new URLSearchParams(window.location.search);
  const r=p.get('room'),c=p.get('court'),j=p.get('judge'),m=p.get('mode');
  if(r)document.getElementById('inp-room').value=r;
  if(c)document.getElementById('inp-court').value=c.toUpperCase();
  if(j)document.getElementById('inp-judge').value=j;
  if(m&&['both','judge','cam'].includes(m)){selectMode(m);}
  if(r&&c)setTimeout(startApp,300);
})();

// ═══════════ 모드 선택 ═══════════
function selectMode(m){
  appMode=m;
  ['both','judge','cam'].forEach(id=>{
    document.getElementById('mode-'+id).classList.toggle('active',id===m);
  });
}

// ═══════════ 앱 시작 ═══════════
async function startApp(){
  roomId=document.getElementById('inp-room').value.trim();
  courtId=document.getElementById('inp-court').value.trim().toUpperCase();
  judgeName=document.getElementById('inp-judge').value.trim()||'심판';
  if(!roomId||!courtId){alert('Room ID와 코트를 입력하세요');return;}

  localStorage.setItem('mop_jc_room',roomId);
  localStorage.setItem('mop_jc_court',courtId);
  localStorage.setItem('mop_jc_judge',judgeName);

  // UI 업데이트
  document.getElementById('cam-room').textContent='ROOM: '+roomId;
  document.getElementById('cam-court').textContent='C-'+courtId;

  // 카메라 패널 표시 여부
  const camPanel=document.getElementById('cam-panel');
  const foldLine=document.getElementById('fold-line');
  const judgePanel=document.getElementById('judge-panel');

  if(appMode==='judge'){
    camPanel.style.display='none';
    foldLine.classList.remove('show');
  } else {
    camPanel.style.display='block';
    if(appMode==='both')foldLine.classList.add('show');
    // 카메라 시작
    try{
      localStream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode,width:{ideal:1280},height:{ideal:720},frameRate:{ideal:24}},audio:false
      });
      document.getElementById('cam-video').srcObject=localStream;
    }catch(e){console.warn('카메라 오류:',e.message);}
  }

  // 화면 전환
  document.getElementById('s-setup').classList.remove('show');
  document.getElementById('s-main').classList.add('show');

  // Firebase 연결
  connectFirebase();

  // PeerJS (카메라 전용 또는 통합)
  if(appMode!=='judge')initPeer();

  // 심판 heartbeat
  startHeartbeat();
  detectFold();
}

// ═══════════ Firebase 구독 ═══════════
function connectFirebase(){
  // 연결 상태
  db.ref('.info/connected').on('value',s=>{
    document.getElementById('fb-dot').textContent=s.val()?'🔗':'⚠';
  });

  // 운영앱 현재 히트 + 상태 구독
  db.ref(`${roomId}/operator`).on('value',s=>{
    const v=s.val();
    if(!v)return;
    if(v.currentHeatNo&&v.currentHeatNo!==currentHeatNo){
      currentHeatNo=v.currentHeatNo;
      loadHeatData();
    }
    if(v.heatStatus)updateHeatState(v.heatStatus);
  });

  // 신호음 구독
  db.ref(`${roomId}/signals/current`).on('value',s=>{
    const v=s.val();
    if(!v||v.ts===lastSignalTs)return;
    lastSignalTs=v.ts;
    if(Date.now()-v.ts>5000)return; // 5초 이상 된 신호 무시
    playSignal(v.type);
  });

  // 초기 히트 로드
  loadHeatData();
}

function loadHeatData(){
  const heatKey=`heat_${currentHeatNo}`;
  db.ref(`${roomId}/heats/${heatKey}`).once('value',s=>{
    const h=s.val();
    if(!h)return;
    currentHeat=h;
    updateHeatUI(h);
    clearCount();
    isReady=false;
    updateReadyBtn();
  });
}

function updateHeatUI(h){
  const no=h.no||h.heatNo||currentHeatNo;
  document.getElementById('heat-badge').textContent=`HEAT ${no}`;
  document.getElementById('event-name').textContent=h.event_name||h.event||'—';
  document.getElementById('event-div').textContent=h.division||'—';
  document.getElementById('hstate-event').textContent=`${h.event||'—'} · ${h.division||''}`;

  // 이 코트 선수 찾기
  const courts=h.courts||{};
  const key=Object.keys(courts).find(k=>k.toUpperCase()===courtId)||courtId;
  const ath=courts[key]?.athlete||null;

  if(ath){
    document.getElementById('ath-bib').textContent=`#${ath.bib||'—'}`;
    document.getElementById('ath-name').textContent=ath.name||'—';
    document.getElementById('ath-club').textContent=[ath.club,ath.country].filter(Boolean).join(' · ')||'—';
    document.getElementById('cam-athlete').textContent=ath.name||'';
  } else {
    document.getElementById('ath-bib').textContent='#—';
    document.getElementById('ath-name').textContent='선수 미배정';
    document.getElementById('ath-club').textContent='—';
    document.getElementById('cam-athlete').textContent='';
  }
}

function updateHeatState(state){
  const el=document.getElementById('hstate-badge');
  const states={
    idle:  {cls:'hstate-idle',   txt:'⏸ 대기'},
    calling:{cls:'hstate-calling',txt:'📢 소집'},
    racing:{cls:'hstate-racing', txt:'▶ 진행 중'},
    finished:{cls:'hstate-finished',txt:'✓ 완료'},
  };
  const s=states[state]||states.idle;
  el.className='hstate-badge '+s.cls;
  el.textContent=s.txt;
  // 진행 중이 됐을 때 화면 강조
  if(state==='racing'){
    // 진행 중 시작되면 +1 버튼 하이라이트
    const bigBtn=document.querySelector('.c-big');
    if(bigBtn)bigBtn.style.borderColor='var(--ac)';
  } else {
    const bigBtn=document.querySelector('.c-big');
    if(bigBtn)bigBtn.style.borderColor='';
  }
}

// ═══════════ 카운팅 ═══════════
function addCount(n){
  count=Math.max(0,count+n);
  updateCountDisplay(n>0?'bump':'minus-anim');
  document.getElementById('cam-count').textContent=count;
  db.ref(`${roomId}/monitoring/judges/${courtId}/liveCount`).set(count);
}
function clearCount(){count=0;updateCountDisplay();}
function updateCountDisplay(anim=''){
  const el=document.getElementById('count-display-sm');
  if(el)el.textContent=count;
  // 카메라 오버레이 카운트도 업데이트
  document.getElementById('cam-count').textContent=count;
  // +1 버튼 플래시 효과
  const bigBtn=document.querySelector('.c-big');
  if(bigBtn&&anim){
    bigBtn.style.filter=anim==='bump'?'brightness(1.4)':'brightness(0.8)';
    setTimeout(()=>bigBtn.style.filter='',120);
  }
}
let lastTap=0;
function handleTap(e){
  e.preventDefault();
  const now=Date.now();
  if(now-lastTap<150)return;
  lastTap=now;
  addCount(1);
}

// ═══════════ 준비 완료 ═══════════
function toggleReady(){
  isReady=!isReady;
  updateReadyBtn();
  db.ref(`${roomId}/monitoring/judges/${courtId}`).update({
    ready:isReady,judgeName,court:courtId,ts:Date.now()
  });
  showToast(isReady?'✅ 준비 완료 전송':'⏸ 준비 취소');
}
function updateReadyBtn(){
  const btn=document.getElementById('btn-ready');
  btn.textContent=isReady?'✅ 준비됨':'✋ 준비 완료';
  btn.classList.toggle('on',isReady);
}

// ═══════════ 기록 제출 ═══════════
async function submitScore(){
  if(!currentHeat){showToast('히트 정보 없음',true);return;}
  const score=count;
  const heatKey=`heat_${currentHeatNo}`;
  const courts=currentHeat.courts||{};
  const key=Object.keys(courts).find(k=>k.toUpperCase()===courtId)||courtId;
  try{
    await db.ref(`${roomId}/heats/${heatKey}/courts/${key}`).update({
      score,judgeStatus:'submitted',judgeName,submittedAt:Date.now()
    });
    await db.ref(`${roomId}/monitoring/judges/${courtId}`).update({
      ready:false,score,submitted:true,ts:Date.now()
    });
    // 완료 오버레이
    document.getElementById('ov-score').textContent=`기록: ${score}`;
    document.getElementById('ov-sub').textContent=
      `코트 ${courtId} · HEAT ${currentHeatNo} · ${document.getElementById('ath-name').textContent}`;
    document.getElementById('overlay-done').classList.add('show');
    isReady=false;updateReadyBtn();
  }catch(e){showToast('제출 실패: '+e.message,true);}
}
function closeOverlay(){document.getElementById('overlay-done').classList.remove('show');}

// ═══════════ 신호음 수신 ═══════════
function playSignal(type){
  if(type==='start')BEEP.start();
  else if(type==='end')BEEP.end();
  else if(type==='recall')BEEP.recall();
  // 화면 플래시
  const fl=document.getElementById('sig-flash');
  fl.className='sig-flash '+(type==='start'?'start':type==='end'?'end':'');
  fl.classList.add('show');
  setTimeout(()=>fl.classList.remove('show'),type==='end'?700:350);
}

// ═══════════ 심판 heartbeat ═══════════
function startHeartbeat(){
  function beat(){
    db.ref(`${roomId}/monitoring/judges/${courtId}`).update({
      online:true,judgeName,court:courtId,lastSeen:Date.now(),ready:isReady
    });
    if(appMode!=='judge'){
      db.ref(`${roomId}/monitoring/cameras/${courtId}`).update({
        online:true,court:courtId,lastSeen:Date.now()
      });
    }
  }
  beat();
  setInterval(beat,5000);
  window.addEventListener('beforeunload',()=>{
    db.ref(`${roomId}/monitoring/judges/${courtId}/online`).set(false);
    if(appMode!=='judge')db.ref(`${roomId}/monitoring/cameras/${courtId}/online`).set(false);
  });
}

// ═══════════ PeerJS 카메라 송출 ═══════════
function initPeer(){
  const myId=`mop-${roomId}-cam-${courtId}`;
  if(peer){try{peer.destroy();}catch(e){}}
  peer=new Peer(myId,{host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0});
  peer.on('open',()=>{setCamStatus('conn','뷰어 연결 중...');callViewer();});
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){setCamStatus('conn','뷰어 대기 중...');retryTimer=setTimeout(callViewer,2500);}
    else{setCamStatus('off','오류: '+e.type);retryTimer=setTimeout(initPeer,4000);}
  });
  peer.on('disconnected',()=>{setCamStatus('conn','재연결 중...');setTimeout(()=>{if(peer&&!peer.destroyed)peer.reconnect();},2000);});
}
function callViewer(){
  if(!peer||peer.destroyed||!localStream)return;
  clearTimeout(retryTimer);
  const viewerId=`mop-${roomId}-viewer`;
  try{
    currentCall=peer.call(viewerId,localStream,{metadata:{court:courtId,room:roomId}});
    if(!currentCall){retryTimer=setTimeout(callViewer,2500);return;}
    currentCall.on('stream',()=>setCamStatus('live','LIVE 송출'));
    currentCall.on('close',()=>{setCamStatus('conn','재연결...');retryTimer=setTimeout(callViewer,2500);});
    currentCall.on('error',()=>retryTimer=setTimeout(callViewer,2500));
  }catch(e){retryTimer=setTimeout(callViewer,2500);}
}
function setCamStatus(state,txt){
  const d=document.getElementById('cam-dot');
  d.className='cam-dot '+(state==='live'?'live':state==='conn'?'conn':'off');
  document.getElementById('cam-status-txt').textContent=txt;
}

// ═══════════ 카메라 전환 ═══════════
async function flipCamera(){
  facingMode=facingMode==='environment'?'user':'environment';
  if(localStream)localStream.getTracks().forEach(t=>t.stop());
  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode,width:{ideal:1280},height:{ideal:720}},audio:false
    });
    document.getElementById('cam-video').srcObject=localStream;
    if(currentCall)currentCall.close();
    callViewer();
  }catch(e){console.warn(e);}
}

// ═══════════ Z플립 폴드 비율 ═══════════
function toggleFold(){
  foldIdx=(foldIdx+1)%FOLD_STEPS.length;
  const pct=FOLD_STEPS[foldIdx];
  document.getElementById('cam-panel').style.height=pct+'vh';
  document.documentElement.style.setProperty('--fold',pct+'vh');
  showToast(`카메라 영역: ${pct}%`);
}
function detectFold(){
  if('getWindowSegments' in window){
    const segs=window.getWindowSegments();
    if(segs&&segs.length===2){
      const pct=Math.round(segs[0].height/window.innerHeight*100);
      document.getElementById('cam-panel').style.height=Math.max(20,Math.min(80,pct))+'vh';
    }
  }
}

// ═══════════ 토스트 ═══════════
let _toastTimer=null;
function showToast(msg){
  let t=document.querySelector('.toast');if(t)t.remove();
  t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t?.remove(),2000);
}

// iOS 오디오 언락
document.addEventListener('touchstart',()=>{try{getCtx();}catch(e){}},{once:true});
</script>
