<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>심판+카메라 (Z플립) — 모두의 플레이</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050810;--sur2:#161b24;
  --ac:#00e5ff;--ac2:#ff3d71;--gn:#00ff88;--yw:#ffd60a;
  --tx:#e8eaf2;--mu:#4a5568;
  --fold:50vh;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;}

/* ── 설정 화면 ── */
#s-setup{display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;min-height:100dvh;background:radial-gradient(ellipse at 30% 20%,#0a1628,var(--bg) 60%);}
#s-setup.show{display:flex;}
.logo-txt{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:.4em;color:var(--mu);}
.big-title{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--ac);letter-spacing:.06em;line-height:1;}
.card{width:100%;max-width:340px;background:var(--sur2);border:1.5px solid #1e2535;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-size:10px;color:#718096;letter-spacing:.1em;text-transform:uppercase;}
.inp{background:#080b12;border:1.5px solid #1e2535;border-radius:11px;padding:12px 14px;font-size:16px;color:var(--tx);outline:none;width:100%;font-family:'Noto Sans KR',sans-serif;transition:border-color .2s;}
.inp:focus{border-color:var(--ac);}
.inp-mono{font-family:monospace;letter-spacing:.05em;}
.big-btn{width:100%;padding:15px;border:none;border-radius:13px;font-size:16px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;}
.big-btn:active{transform:scale(.97);}
.btn-ac{background:var(--ac);color:#000;}

/* ── 메인: 상하 분할 ── */
#s-main{display:none;flex-direction:column;height:100dvh;overflow:hidden;}
#s-main.show{display:flex;}

/* ─ 상단 카메라 ─ */
#cam-panel{position:relative;height:var(--fold);flex-shrink:0;background:#000;overflow:hidden;}
#cam-video{width:100%;height:100%;object-fit:cover;display:block;}
.cam-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;}
.cam-top{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 12px 0;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);padding-bottom:24px;}
.cam-court-lbl{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--ac);line-height:1;text-shadow:0 0 18px rgba(0,229,255,.5);}
.cam-status{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.6);border-radius:20px;padding:4px 10px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);font-size:10px;pointer-events:auto;}
.dot{width:6px;height:6px;border-radius:50%;}
.dot.live{background:var(--ac2);animation:pls .7s ease-in-out infinite alternate;}
.dot.conn{background:var(--ac);animation:pls .6s ease-in-out infinite alternate;}
.dot.off{background:var(--mu);}
@keyframes pls{from{opacity:.3;}to{opacity:1;}}
.cam-bot{display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px 10px;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);padding-top:24px;pointer-events:auto;}
.cam-count-lbl{font-family:'Bebas Neue',sans-serif;font-size:54px;line-height:1;color:#fff;text-shadow:0 0 24px rgba(255,255,255,.2);}
.cam-btns{display:flex;gap:8px;}
.cam-btn{width:38px;height:38px;border:1.5px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(0,0,0,.6);color:white;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cam-btn:active{transform:scale(.9);}

/* 경첩선 */
#fold-line{height:3px;background:linear-gradient(90deg,transparent,rgba(0,229,255,.4),var(--ac),rgba(0,229,255,.4),transparent);flex-shrink:0;position:relative;}
#fold-line::after{content:'Z FLIP';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Bebas Neue',sans-serif;font-size:9px;letter-spacing:.3em;color:rgba(0,229,255,.45);background:var(--bg);padding:0 8px;}

/* ─ 하단 심판 ─ */
#judge-panel{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;min-height:0;}

/* 히트 상태 바 */
.hstate-bar{display:flex;align-items:center;gap:8px;padding:5px 12px;background:rgba(0,0,0,.5);border-bottom:1px solid #1e2535;flex-shrink:0;}
.hstate-pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
.h-idle{background:rgba(74,85,104,.3);color:#718096;}
.h-calling{background:rgba(255,214,10,.2);color:var(--yw);}
.h-racing{background:rgba(0,229,255,.2);color:var(--ac);}
.h-finished{background:rgba(0,255,136,.2);color:var(--gn);}
.fb-dot-sm{font-size:10px;margin-left:auto;}

/* 선수 정보 (컴팩트) */
.ath-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(0,229,255,.04);border-bottom:1px solid rgba(0,229,255,.08);flex-shrink:0;}
.ath-bib-sm{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--ac);line-height:1;flex-shrink:0;}
.ath-name-sm{font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.ath-club-sm{font-size:10px;color:#718096;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;max-width:40%;}

/* ━━━ 심판 UI (judge.html과 동일 구조) ━━━ */
.judge-body{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}

/* 상단: 초기화/준비/제출 */
.top-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:6px 10px;flex-shrink:0;border-bottom:1px solid #1e2535;}
.act-btn{padding:10px 4px;border:none;border-radius:11px;font-size:12px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;}
.act-btn:active{transform:scale(.96);}
.act-clear{background:var(--sur2);color:#718096;border:1.5px solid #1e2535;}
.act-ready{background:rgba(255,214,10,.15);color:var(--yw);border:1.5px solid rgba(255,214,10,.3);}
.act-ready.on{background:var(--yw);color:#000;}
.act-submit{background:var(--ac);color:#000;}

/* 중단: −1 / COUNT / +10 */
.sub-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:5px 10px;flex-shrink:0;}
.s-btn{padding:12px 0;border:none;border-radius:11px;font-family:'Bebas Neue',sans-serif;font-size:22px;cursor:pointer;transition:all .1s;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;}
.s-btn:active{transform:scale(.93);filter:brightness(1.3);}
.s-lbl{font-size:9px;font-family:'Noto Sans KR',sans-serif;font-weight:700;opacity:.7;margin-top:2px;}
.s-minus{background:rgba(255,61,113,.15);color:var(--ac2);border:1.5px solid rgba(255,61,113,.3);}
.s-count{background:rgba(255,255,255,.03);border:1.5px solid #1e2535;color:var(--ac);}
.s-plus10{background:rgba(0,255,136,.1);color:var(--gn);border:1.5px solid rgba(0,255,136,.25);}
#count-sm{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--ac);line-height:1;}

/* +1 전체 버튼 (하단 전체, 텍스트 없음) */
#btn-plus1{
  flex:1;width:100%;border:none;
  background:rgba(0,229,255,.08);
  border-top:2px solid rgba(0,229,255,.15);
  cursor:pointer;transition:all .08s;
  user-select:none;-webkit-user-select:none;
}
#btn-plus1:active{background:rgba(0,229,255,.22);filter:brightness(1.2);}

/* 신호음 플래시 */
#sig-flash{position:fixed;inset:0;z-index:200;pointer-events:none;opacity:0;transition:opacity .1s;}
#sig-flash.start{background:rgba(0,229,255,.25);}
#sig-flash.end{background:rgba(255,61,113,.2);}
#sig-flash.show{opacity:1;}

/* 제출 오버레이 */
#overlay-done{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(10px);}
#overlay-done.show{display:flex;}
.ov-icon{font-size:56px;}
.ov-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.06em;}
.ov-sub{font-size:13px;color:#718096;text-align:center;padding:0 20px;}
.ov-btn{padding:13px 30px;border-radius:13px;border:none;font-size:15px;font-weight:700;cursor:pointer;background:var(--ac);color:#000;font-family:'Noto Sans KR',sans-serif;}

/* 폴드 비율 조절 버튼 */
.fold-adjust{position:absolute;right:8px;bottom:8px;pointer-events:auto;}
.fold-btn{width:34px;height:34px;border:1.5px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(0,0,0,.6);color:white;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.fold-btn:active{transform:scale(.9);}

/* 녹화 상태 표시 */
#rec-auto-badge{
  display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);
  z-index:5;background:rgba(255,61,113,.15);border:1px solid rgba(255,61,113,.5);
  border-radius:20px;padding:3px 12px;font-size:10px;font-weight:700;color:var(--ac2);
  white-space:nowrap;display:none;align-items:center;gap:5px;
}
#rec-auto-badge.show{display:flex;}
.rec-dot-sm{width:5px;height:5px;border-radius:50%;background:var(--ac2);animation:pls .7s ease-in-out infinite alternate;}
#rec-timer-sm{
  position:absolute;bottom:48px;left:50%;transform:translateX(-50%);
  font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--ac2);
  text-shadow:0 0 10px rgba(255,61,113,.6);display:none;z-index:5;white-space:nowrap;
}

/* 토스트 */
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.3);color:var(--ac);border-radius:20px;padding:8px 18px;font-size:12px;white-space:nowrap;z-index:50;animation:tst .3s ease;pointer-events:none;}
@keyframes tst{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
</style>
<script>
// 모바일 디버그 콘솔 (URL에 ?debug=1 붙이면 화면에 콘솔 버튼)
if(new URLSearchParams(location.search).get('debug')==='1'){
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/eruda';
  s.onload=()=>eruda.init();
  document.head.appendChild(s);
}
</script>
</head>
<body>

<!-- 설정 화면 -->
<div id="s-setup" class="show">
  <div class="logo-txt">모두의 플레이</div>
  <div class="big-title">📷⚖ Z플립 통합</div>
  <div style="font-size:11px;color:#718096;text-align:center">상단=카메라 송출 · 하단=심판 카운팅</div>
  <div class="card">
    <div class="fld"><label>📡 Room ID</label>
      <input class="inp inp-mono" id="inp-room" placeholder="예: room_001"></div>
    <div class="fld"><label>🏟 담당 코트</label>
      <input class="inp inp-mono" id="inp-court" placeholder="예: A" oninput="this.value=this.value.toUpperCase()"></div>
    <div class="fld"><label>⚖ 심판 이름</label>
      <input class="inp" id="inp-judge" placeholder="홍길동"></div>
    <button class="big-btn btn-ac" onclick="startApp()">🚀 시작</button>
  </div>
</div>

<!-- 메인 화면 -->
<div id="s-main">
  <!-- 상단: 카메라 -->
  <div id="cam-panel">
    <video id="cam-video" playsinline autoplay muted></video>
    <!-- 자동 녹화 배지 -->
    <div id="rec-auto-badge"><div class="rec-dot-sm"></div>AUTO REC</div>
    <div id="rec-timer-sm"></div>
    <div class="cam-overlay">
      <div class="cam-top">
        <div class="cam-court-lbl" id="cam-court-lbl">C-A</div>
        <div class="cam-status">
          <div class="dot off" id="cam-dot"></div>
          <span id="cam-status-txt" style="color:rgba(255,255,255,.6)">연결 중...</span>
        </div>
      </div>
      <div class="cam-bot">
        <div class="cam-count-lbl" id="cam-count">0</div>
        <div class="cam-btns">
          <div class="cam-btn" onclick="flipCamera()">🔄</div>
        </div>
      </div>
      <div class="fold-adjust">
        <div class="fold-btn" onclick="toggleFold()" title="비율 조절">↕</div>
      </div>
    </div>
  </div>

  <!-- 경첩선 -->
  <div id="fold-line"></div>

  <!-- 하단: 심판 -->
  <div id="judge-panel">
    <!-- 히트 상태 -->
    <div class="hstate-bar">
      <div class="hstate-pill h-idle" id="hstate">⏸ 대기</div>
      <div style="font-size:10px;color:#718096;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:6px" id="hstate-ev">—</div>
      <div class="fb-dot-sm" id="fb-dot">⏳</div>
    </div>
    <!-- 선수 (컴팩트) -->
    <div class="ath-bar">
      <div class="ath-bib-sm" id="ath-bib">#—</div>
      <div class="ath-name-sm" id="ath-name">선수 대기 중...</div>
      <div class="ath-club-sm" id="ath-club">—</div>
    </div>

    <div class="judge-body">
      <!-- 상단: 초기화/준비/제출 -->
      <div class="top-actions">
        <button class="act-btn act-clear" onclick="clearCount()">🗑 초기화</button>
        <button class="act-btn act-ready" id="btn-ready" onclick="toggleReady()">✋ 준비</button>
        <button class="act-btn act-submit" onclick="submitScore()">✓ 제출</button>
      </div>
      <!-- 중단: −1 / COUNT / +10 -->
      <div class="sub-btns">
        <button class="s-btn s-minus" onclick="addCount(-1)">−1<span class="s-lbl">빼기</span></button>
        <div class="s-btn s-count" style="cursor:default">
          <div id="count-sm">0</div>
          <span class="s-lbl">COUNT</span>
        </div>
        <button class="s-btn s-plus10" onclick="addCount(10)">+10<span class="s-lbl">10개</span></button>
      </div>
      <!-- 하단 전체: +1 (무표시) -->
      <button id="btn-plus1" onclick="addCount(1)" ontouchstart="handleTap(event)"></button>
    </div>
  </div>
</div>

<!-- 제출 오버레이 -->
<div id="overlay-done">
  <div class="ov-icon">✅</div>
  <div class="ov-title" id="ov-score">기록 제출</div>
  <div class="ov-sub" id="ov-sub">다음 히트를 기다려 주세요</div>
  <button class="ov-btn" onclick="document.getElementById('overlay-done').classList.remove('show')">확인</button>
</div>

<!-- 신호음 플래시 -->
<div id="sig-flash"></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyDOrKZDSNiA4sLnkNBiLVehE8xtrU-2JLY",
  authDomain:"mop-jumprope.firebaseapp.com",
  databaseURL:"https://mop-jumprope-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"mop-jumprope",storageBucket:"mop-jumprope.firebasestorage.app",
  messagingSenderId:"875740425909",appId:"1:875740425909:web:59768e633b7a42733918fc"
});
const db=firebase.database();

// 오디오
let audioCtx=null;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function tone(f,d,t='sine',v=.6,o=0){const ctx=getCtx(),osc=ctx.createOscillator(),g=ctx.createGain();osc.type=t;osc.frequency.value=f;osc.connect(g);g.connect(ctx.destination);const ts=ctx.currentTime+o;g.gain.setValueAtTime(0,ts);g.gain.linearRampToValueAtTime(v,ts+.005);g.gain.linearRampToValueAtTime(v,ts+d-.05);g.gain.linearRampToValueAtTime(0,ts+d);osc.start(ts);osc.stop(ts+d);}
const BEEP={
  start:()=>{tone(880,.12,'sine',.5,0);tone(880,.12,'sine',.5,.35);tone(1320,.6,'sine',.75,.7);},
  end:()=>{tone(440,.9,'sine',.7,0);},
  recall:()=>{for(let i=0;i<4;i++)tone(i%2?880:660,.2,'square',.45,i*.28);},
};

// 상태 변수
let roomId='',courtId='',judgeName='';
let count=0,isReady=false;
let currentHeatNo=1,currentHeat=null;
let localStream=null,facingMode='environment';
let peer=null,currentCall=null,retryTimer=null;
let lastSignalTs=0;
const FOLD_STEPS=[30,40,50,60,70];
let foldIdx=2;

// ── 녹화 변수 ──────────────────────────────
let mediaRecorder=null;
let recChunks=[];
let recStartTime=null;
let recTimerInterval=null;
let isAutoRec=false;
let prevHeatStatus='';
let recHeatInfo={heatNo:'',playerName:'',playerBib:''};

function getSupportedMimeType(){
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  for(const t of types){if(MediaRecorder.isTypeSupported(t))return t;}
  return '';
}

function startAutoRec(){
  if(isAutoRec||!localStream)return;
  isAutoRec=true;
  recChunks=[];
  // 현재 선수 정보 스냅샷
  recHeatInfo.heatNo=currentHeatNo;
  recHeatInfo.playerName=document.getElementById('ath-name').textContent.replace(/\uFFFD/g,'').trim();
  recHeatInfo.playerBib=document.getElementById('ath-bib').textContent.replace('#','').trim();

  const mimeType=getSupportedMimeType();
  try{
    mediaRecorder=new MediaRecorder(localStream,mimeType?{mimeType}:{});
  }catch(e){isAutoRec=false;console.error('MediaRecorder 오류:',e);return;}

  mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)recChunks.push(e.data);};
  mediaRecorder.onstop=()=>saveRec();
  mediaRecorder.start(1000);
  recStartTime=Date.now();

  document.getElementById('rec-auto-badge').classList.add('show');
  document.getElementById('rec-timer-sm').style.display='block';
  updateRecTimer();
  recTimerInterval=setInterval(updateRecTimer,1000);
  console.log('[REC] 자동 녹화 시작');
}

function stopAutoRec(){
  if(!isAutoRec)return;
  isAutoRec=false;
  if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();
  clearInterval(recTimerInterval);
  document.getElementById('rec-auto-badge').classList.remove('show');
  document.getElementById('rec-timer-sm').style.display='none';
  console.log('[REC] 자동 녹화 중지');
}

function saveRec(){
  if(!recChunks.length)return;
  const mimeType=mediaRecorder.mimeType||'video/webm';
  const ext=mimeType.includes('mp4')?'mp4':'webm';
  const blob=new Blob(recChunks,{type:mimeType});
  const now=new Date();
  const dateStr=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  const timeStr=`${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const bibStr=recHeatInfo.playerBib?`_${recHeatInfo.playerBib}`:'';
  const nameStr=recHeatInfo.playerName&&recHeatInfo.playerName!=='선수 대기 중...'
    ?`_${recHeatInfo.playerName.replace(/\s/g,'')}`:'';
  const filename=`코트${courtId}_히트${recHeatInfo.heatNo}${bibStr}${nameStr}_${dateStr}_${timeStr}.${ext}`;
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  showToast(`✅ ${filename}`);
  recChunks=[];
}

function updateRecTimer(){
  if(!recStartTime)return;
  const elapsed=Math.floor((Date.now()-recStartTime)/1000);
  const m=String(Math.floor(elapsed/60)).padStart(2,'0');
  const s=String(elapsed%60).padStart(2,'0');
  document.getElementById('rec-timer-sm').textContent=`⏺ ${m}:${s}`;
}

// URL 파라미터 자동 인식
(function(){
  const p=new URLSearchParams(window.location.search);
  if(p.get('room'))document.getElementById('inp-room').value=p.get('room');
  if(p.get('court'))document.getElementById('inp-court').value=p.get('court').toUpperCase();
  if(p.get('judge'))document.getElementById('inp-judge').value=p.get('judge');
  if(p.get('room')&&p.get('court'))setTimeout(startApp,300);
})();

async function startApp(){
  roomId=document.getElementById('inp-room').value.trim();
  courtId=document.getElementById('inp-court').value.trim().toUpperCase();
  judgeName=document.getElementById('inp-judge').value.trim()||'심판';
  if(!roomId||!courtId){alert('Room ID와 코트를 입력하세요');return;}

  document.getElementById('cam-court-lbl').textContent='C-'+courtId;

  // 카메라 시작
  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode,width:{ideal:1280},height:{ideal:720},frameRate:{ideal:24}},audio:false
    });
    document.getElementById('cam-video').srcObject=localStream;
  }catch(e){console.warn('카메라 오류:',e.message);}

  document.getElementById('s-setup').classList.remove('show');
  document.getElementById('s-main').classList.add('show');

  connectFirebase();
  initPeer();
  startHeartbeat();
  detectFold();
}

// ── Firebase ──
function connectFirebase(){
  db.ref('.info/connected').on('value',s=>document.getElementById('fb-dot').textContent=s.val()?'🔗':'⚠');

  db.ref(`${roomId}/operator`).on('value',s=>{
    const v=s.val();if(!v)return;
    if(v.currentHeatNo&&v.currentHeatNo!==currentHeatNo){
      currentHeatNo=v.currentHeatNo;
      resetJudgeState();
      loadHeatData();
    }
    if(v.heatStatus)updateHeatState(v.heatStatus);
  });

  db.ref(`${roomId}/signals/current`).on('value',s=>{
    const v=s.val();
    if(!v||v.ts===lastSignalTs||Date.now()-v.ts>5000)return;
    lastSignalTs=v.ts;
    playSignal(v.type);
    // ★ end 신호 → 자동 녹화 중지
    if(v.type==='end') stopAutoRec();
  });

  loadHeatData();
}

function resetJudgeState(){
  db.ref(`${roomId}/monitoring/judges/${courtId}`).update({ready:false,submitted:false,score:null,ts:Date.now()});
  isReady=false;updateReadyBtn();clearCount();
}

function loadHeatData(){
  db.ref(`${roomId}/heats/heat_${currentHeatNo}`).once('value',s=>{
    const h=s.val();if(!h)return;
    currentHeat=h;
    const no=h.no||h.heatNo||currentHeatNo;
    document.getElementById('hstate-ev').textContent=`HEAT ${no} · ${h.event||'—'}`;
    const courts=h.courts||{};
    const key=Object.keys(courts).find(k=>k.toUpperCase()===courtId)||courtId;
    const ath=courts[key]?.athlete||null;
    if(ath){
      document.getElementById('ath-bib').textContent=`#${ath.bib||'—'}`;
      document.getElementById('ath-name').textContent=ath.name||'—';
      document.getElementById('ath-club').textContent=ath.club||'—';
    } else {
      document.getElementById('ath-bib').textContent='#—';
      document.getElementById('ath-name').textContent='미배정';
      document.getElementById('ath-club').textContent='—';
    }
  });
}

function updateHeatState(state){
  const el=document.getElementById('hstate');
  const map={idle:{c:'h-idle',t:'⏸ 대기'},calling:{c:'h-calling',t:'📢 소집'},racing:{c:'h-racing',t:'▶ 진행'},finished:{c:'h-finished',t:'✓ 완료'}};
  const s=map[state]||map.idle;
  el.className='hstate-pill '+s.c;el.textContent=s.t;
  document.getElementById('btn-plus1').style.background=
    state==='racing'?'rgba(0,229,255,.15)':'rgba(0,229,255,.08)';

  // ── 자동 녹화 트리거 ──
  if(state==='racing'&&prevHeatStatus!=='racing'){
    startAutoRec();
  } else if((state==='finished'||state==='idle')&&prevHeatStatus==='racing'){
    stopAutoRec();
  }
  prevHeatStatus=state;
}

// ── 카운팅 ──
function addCount(n){
  count=Math.max(0,count+n);
  document.getElementById('count-sm').textContent=count;
  document.getElementById('cam-count').textContent=count;
  db.ref(`${roomId}/monitoring/judges/${courtId}/liveCount`).set(count);
  const btn=document.getElementById('btn-plus1');
  btn.style.filter=n>0?'brightness(1.5)':'brightness(.7)';
  setTimeout(()=>btn.style.filter='',100);
}
function clearCount(){count=0;document.getElementById('count-sm').textContent=0;document.getElementById('cam-count').textContent=0;}
let lastTap=0;
function handleTap(e){
  e.preventDefault();
  const now=Date.now();if(now-lastTap<150)return;lastTap=now;addCount(1);
}

// ── 준비 ──
function toggleReady(){
  isReady=!isReady;updateReadyBtn();
  db.ref(`${roomId}/monitoring/judges/${courtId}`).update({ready:isReady,judgeName,court:courtId,ts:Date.now()});
  showToast(isReady?'✅ 준비 완료 전송':'⏸ 준비 취소');
}
function updateReadyBtn(){
  const btn=document.getElementById('btn-ready');
  btn.textContent=isReady?'✅ 준비됨':'✋ 준비';
  btn.classList.toggle('on',isReady);
}

// ── 제출 ──
async function submitScore(){
  if(!currentHeat)return;
  const score=count;
  const heatKey=`heat_${currentHeatNo}`;
  const courts=currentHeat.courts||{};
  const key=Object.keys(courts).find(k=>k.toUpperCase()===courtId)||courtId;
  try{
    await db.ref(`${roomId}/heats/${heatKey}/courts/${key}`).update({score,judgeStatus:'submitted',judgeName,submittedAt:Date.now()});
    await db.ref(`${roomId}/monitoring/judges/${courtId}`).update({ready:false,score,submitted:true,ts:Date.now()});
    document.getElementById('ov-score').textContent=`기록: ${score}`;
    document.getElementById('ov-sub').textContent=`코트 ${courtId} · HEAT ${currentHeatNo}`;
    document.getElementById('overlay-done').classList.add('show');
    isReady=false;updateReadyBtn();
  }catch(e){showToast('제출 실패',true);}
}

// ── 신호음 ──
function playSignal(type){
  if(type==='start')BEEP.start();
  else if(type==='end')BEEP.end();
  else if(type==='recall')BEEP.recall();
  const fl=document.getElementById('sig-flash');
  fl.className='sig-flash '+(type==='start'?'start':type==='end'?'end':'');
  fl.classList.add('show');
  setTimeout(()=>fl.classList.remove('show'),type==='end'?700:350);
}

// ── PeerJS ──
function initPeer(){
  const myId=`mop-${roomId}-cam-${courtId}`;
  if(peer){try{peer.destroy();}catch(e){}}
  peer=new Peer(myId,{host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0});
  peer.on('open',()=>{setCamStatus('conn','뷰어 연결 중...');callViewer();});
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){setCamStatus('conn','뷰어 대기 중...');retryTimer=setTimeout(callViewer,2500);}
    else{setCamStatus('off','오류');retryTimer=setTimeout(initPeer,4000);}
  });
  peer.on('disconnected',()=>{setCamStatus('conn','재연결...');setTimeout(()=>{if(peer&&!peer.destroyed)peer.reconnect();},2000);});
}
function callViewer(){
  if(!peer||peer.destroyed||!localStream)return;
  clearTimeout(retryTimer);
  const courtNum=parseInt(courtId);
  const targetPage=(!isNaN(courtNum)&&courtNum>=13)?2:1;
  const primaryViewer=`mop-${roomId}-viewer-p${targetPage}`;
  const legacyViewer=`mop-${roomId}-viewer`;
  console.log(`[JudgeCam] court ${courtId} → trying ${primaryViewer}`);

  tryCallViewer(primaryViewer,()=>{
    console.log(`[JudgeCam] primary 실패, trying ${legacyViewer}`);
    tryCallViewer(legacyViewer,()=>{
      console.log(`[JudgeCam] legacy도 실패, 재시도 예정`);
      retryTimer=setTimeout(callViewer,2500);
    });
  });
}

function tryCallViewer(viewerId,onFail){
  try{
    const call=peer.call(viewerId,localStream,{metadata:{court:courtId,room:roomId}});
    if(!call){onFail();return;}
    let succeeded=false;
    const failTimer=setTimeout(()=>{
      if(!succeeded){
        console.log(`[JudgeCam] ${viewerId} 5초 응답 없음`);
        try{call.close();}catch(e){}
        onFail();
      }
    },5000);

    // ★ 3초 후 자동 LIVE 표시 (stream 이벤트 못 받아도)
    const optimisticTimer=setTimeout(()=>{
      if(!succeeded){
        succeeded=true;
        clearTimeout(failTimer);
        currentCall=call;
        setCamStatus('live','LIVE');
        console.log(`[JudgeCam] ⚡ ${viewerId} 추정 연결`);
      }
    },3000);

    call.on('stream',()=>{
      succeeded=true;
      clearTimeout(failTimer);
      clearTimeout(optimisticTimer);
      currentCall=call;
      setCamStatus('live','LIVE');
      console.log(`[JudgeCam] ✅ ${viewerId} 연결 성공`);
    });
    call.on('close',()=>{
      if(succeeded){setCamStatus('conn','재연결...');retryTimer=setTimeout(callViewer,2500);}
    });
    call.on('error',e=>{
      console.log(`[JudgeCam] call error on ${viewerId}:`,e);
      if(!succeeded){clearTimeout(failTimer);clearTimeout(optimisticTimer);onFail();}
    });
  }catch(e){console.log('[JudgeCam] tryCallViewer ex:',e);onFail();}
}
function setCamStatus(state,txt){
  const d=document.getElementById('cam-dot');
  d.className='dot '+(state==='live'?'live':state==='conn'?'conn':'off');
  document.getElementById('cam-status-txt').textContent=txt;
}

// ── 카메라 전환 ──
async function flipCamera(){
  facingMode=facingMode==='environment'?'user':'environment';
  if(localStream)localStream.getTracks().forEach(t=>t.stop());
  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode,width:{ideal:1280},height:{ideal:720}},audio:false
    });
    document.getElementById('cam-video').srcObject=localStream;
    if(currentCall)currentCall.close();
    callViewer();
  }catch(e){console.warn(e);}
}

// ── 폴드 비율 ──
function toggleFold(){
  foldIdx=(foldIdx+1)%FOLD_STEPS.length;
  const pct=FOLD_STEPS[foldIdx];
  document.getElementById('cam-panel').style.height=pct+'dvh';
  document.documentElement.style.setProperty('--fold',pct+'dvh');
  showToast(`카메라 ${pct}%`);
}
function detectFold(){
  if('getWindowSegments' in window){
    const segs=window.getWindowSegments();
    if(segs&&segs.length===2){
      const pct=Math.round(segs[0].height/window.innerHeight*100);
      const safe=Math.max(20,Math.min(80,pct));
      document.getElementById('cam-panel').style.height=safe+'dvh';
      document.documentElement.style.setProperty('--fold',safe+'dvh');
    }
  }
}

// ── Heartbeat ──
function startHeartbeat(){
  function beat(){
    db.ref(`${roomId}/monitoring/judges/${courtId}`).update({online:true,judgeName,court:courtId,lastSeen:Date.now(),ready:isReady});
    db.ref(`${roomId}/monitoring/cameras/${courtId}`).update({online:true,court:courtId,lastSeen:Date.now()});
  }
  beat();setInterval(beat,5000);
  window.addEventListener('beforeunload',()=>{
    if(mediaRecorder&&mediaRecorder.state==='recording')stopAutoRec();
    db.ref(`${roomId}/monitoring/judges/${courtId}/online`).set(false);
    db.ref(`${roomId}/monitoring/cameras/${courtId}/online`).set(false);
  });
}

let _toast=null;
function showToast(msg){
  if(_toast)_toast.remove();
  _toast=document.createElement('div');_toast.className='toast';_toast.textContent=msg;
  document.body.appendChild(_toast);setTimeout(()=>_toast?.remove(),2000);
}

document.addEventListener('touchstart',()=>{try{getCtx();}catch(e){}},{once:true});
</script>
