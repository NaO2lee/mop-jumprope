<!DOCTYPE html>
<html lang="ko">
<head>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
html,body{margin:0;padding:0;min-height:100vh;background:#080C18;font-family:'Pretendard',sans-serif;color:#E8EAF2;}
.fd{font-family:'Bebas Neue',sans-serif;letter-spacing:.04em;}
.fm{font-family:'JetBrains Mono',monospace;}
.court-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:8px;padding:10px;transition:all .2s;}
.court-card.has-ath{border-color:rgba(0,229,255,.35);background:rgba(0,229,255,.05);}
.court-card.ready{border-color:rgba(0,255,136,.5);background:rgba(0,255,136,.08);}
.court-card.submitted{border-color:rgba(0,255,136,.8);background:rgba(0,255,136,.12);}
.wf-btn{width:100%;text-align:left;border-radius:9px;padding:11px 14px;border:1.5px solid;cursor:pointer;transition:all .12s;user-select:none;}
.wf-btn:active{transform:scale(.96);filter:brightness(1.3);}
.st-box{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px;margin-bottom:8px;}
.st-lbl{font-family:'Bebas Neue',sans-serif;font-size:11px;color:rgba(0,229,255,.6);letter-spacing:.15em;text-align:center;margin-bottom:6px;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;z-index:60;pointer-events:none;}
.toast-item{padding:9px 18px;border-radius:20px;font-size:13px;white-space:nowrap;animation:toastIn .25s ease-out;backdrop-filter:blur(8px);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}.pulse{animation:pulse 1.2s ease-in-out infinite;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

firebase.initializeApp({apiKey:"AIzaSyDOrKZDSNiA4sLnkNBiLVehE8xtrU-2JLY",authDomain:"mop-jumprope.firebaseapp.com",databaseURL:"https://mop-jumprope-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"mop-jumprope",storageBucket:"mop-jumprope.firebasestorage.app",messagingSenderId:"875740425909",appId:"1:875740425909:web:59768e633b7a42733918fc"});
const db=firebase.database();

const ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function cId(i,m='alpha'){return m==='alpha'?ALPHA[i]||String(i+1):String(i+1);}

// ── 오디오 ──
let _ac=null;
function ac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function tone(f,d,t='sine',v=.6,o=0){const ctx=ac(),osc=ctx.createOscillator(),g=ctx.createGain();osc.type=t;osc.frequency.value=f;osc.connect(g);g.connect(ctx.destination);const ts=ctx.currentTime+o;g.gain.setValueAtTime(0,ts);g.gain.linearRampToValueAtTime(v,ts+.005);g.gain.linearRampToValueAtTime(v,ts+d-.05);g.gain.linearRampToValueAtTime(0,ts+d);osc.start(ts);osc.stop(ts+d);}
const SIG={
  start:()=>{tone(880,.12,'sine',.5,0);tone(880,.12,'sine',.5,.35);tone(1320,.6,'sine',.75,.7);},
  warn30:()=>{tone(1046,.3,'sine',.6,0);},
  end:()=>{tone(440,.9,'sine',.7,0);},
  recall:()=>{for(let i=0;i<4;i++)tone(i%2?880:660,.2,'square',.45,i*.28);},
};

// ── TTS 엔진 (큐 방식 + 문장 분할) ──
let _ttsQueue=[];
let _ttsBusy=false;
function _ttsNext(){
  if(_ttsQueue.length===0){_ttsBusy=false;return;}
  _ttsBusy=true;
  const {text,lang}=_ttsQueue.shift();
  if(!window.speechSynthesis||!text){_ttsBusy=false;_ttsNext();return;}
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang==='ko'?'ko-KR':'en-US';
  u.rate=lang==='ko'?0.95:0.9;
  u.pitch=1;u.volume=1;
  let done=false;
  const finish=()=>{if(done)return;done=true;_ttsNext();};
  u.onend=finish;
  u.onerror=finish;
  // 안전장치: speech가 멈춘 채로 안 끝나는 경우 대비 (브라우저 버그 우회)
  setTimeout(()=>{if(!done){console.warn('[TTS] timeout fallback');finish();}}, text.length*200+5000);
  window.speechSynthesis.speak(u);
}
function _ttsEnqueue(text,lang){if(text&&text.trim())_ttsQueue.push({text:text.trim(),lang});if(!_ttsBusy)_ttsNext();}
function _ttsClear(){_ttsQueue=[];window.speechSynthesis?.cancel();_ttsBusy=false;}

// 긴 텍스트를 문장 단위로 분할 (브라우저 TTS는 긴 문장에서 끊김)
function _splitSentences(text){
  if(!text)return[];
  return text.split(/(?<=[.!?。])\s+|(?<=[.!?])$/g)
    .map(s=>s.trim())
    .filter(s=>s.length>0);
}

function speakBoth(ko,en,mode){
  _ttsClear();
  if(mode==='ko'||mode==='both'){
    _splitSentences(ko).forEach(s=>_ttsEnqueue(s,'ko'));
  }
  if(mode==='en'||mode==='both'){
    _splitSentences(en).forEach(s=>_ttsEnqueue(s,'en'));
  }
}

// ── 멘트 템플릿 ──
function ment(type,{comp='대회',heatNo=1,event=''}={}){
  const T={
    open:     {ko:`지금부터 ${comp}을 시작하겠습니다. 참가 선수 여러분을 환영합니다.`,en:`Welcome to the ${comp}. The competition is about to begin.`},
    firstcall:{ko:`${event} 종목에 참가하는 선수들은 소집 장소로 모여 주시기 바랍니다.`,en:`Athletes in ${event}, please proceed to the assembly area.`},
    call:     {ko:`히트 ${heatNo}번 선수들은 코트로 입장해 주시기 바랍니다.`,en:`Heat number ${heatNo}, please enter the competition floor.`},
    start:    {ko:`경기를 시작하겠습니다.`,en:`The competition will now begin.`},
    end:      {ko:`수고하셨습니다. 선수들은 기록을 확인한 후 퇴장해 주시기 바랍니다.`,en:`Well done. Please check your scores and exit the floor.`},
    next:     {ko:`다음 히트 ${heatNo}번 선수들은 준비해 주시기 바랍니다.`,en:`Heat number ${heatNo}, please get ready.`},
    close:    {ko:`이상으로 ${comp}의 모든 경기를 마치겠습니다. 수고하셨습니다.`,en:`This concludes the ${comp}. Thank you for participating.`},
  };
  return T[type]||{ko:'',en:''};
}

// ════════════ 메인 ════════════
function App(){
  const [cfg,setCfg]=useState(()=>{
    const ur=new URLSearchParams(window.location.search).get('room')||'';
    const sv=localStorage.getItem('mop_op_roomid')||'';
    const rid=ur||sv;
    if(ur)localStorage.setItem('mop_op_roomid',ur);
    return{roomId:rid,name:localStorage.getItem('mop_op_name')||'운영자',showCfg:!rid};
  });
  const [meta,setMeta]=useState(null);
  const [heats,setHeats]=useState([]);
  const [heatNo,setHeatNo]=useState(1);
  const [hState,setHState]=useState('idle');
  const [layout,setLayout]=useState(null);
  const [cMode,setCMode]=useState('alpha');
  const [online,setOnline]=useState(false);
  const [judges,setJudges]=useState({});
  const [lang,setLang]=useState('both');
  const [toasts,setToasts]=useState([]);
  const [mentTxt,setMentTxt]=useState('');
  const [customMent,setCustomMent]=useState('');
  const [athletes,setAthletes]=useState({});
  const [soundLib,setSoundLib]=useState({}); // {eventCode: {url, name, ...}}
  const [trackPlaying,setTrackPlaying]=useState(false);
  const trackAudioRef=useRef(null);
  const [cameras,setCameras]=useState({}); // 카메라 연결 상태

  const toast=useCallback((msg,tp='info')=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,tp}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),2800);
  },[]);

  useEffect(()=>{
    if(!cfg.roomId)return;
    const r=cfg.roomId;
    db.ref(`${r}/meta`).on('value',s=>{const v=s.val();setMeta(v);setOnline(!!v);if(v?.stationLayout)setLayout(v.stationLayout);if(v?.courtMode)setCMode(v.courtMode);});
    db.ref(`${r}/athletes`).on('value',s=>setAthletes(s.val()||{}));
    db.ref(`${r}/heats`).on('value',s=>{
      const arr=Object.values(s.val()||{}).sort((a,b)=>parseFloat(String(a.no||a.heatNo||0).replace('-','.'))-parseFloat(String(b.no||b.heatNo||0).replace('-','.')));
      setHeats(arr);
    });
    db.ref(`${r}/operator`).on('value',s=>{const v=s.val();if(!v)return;if(v.currentHeatNo)setHeatNo(v.currentHeatNo);if(v.heatStatus)setHState(v.heatStatus);if(v.lang)setLang(v.lang);});
    db.ref(`${r}/monitoring/judges`).on('value',s=>setJudges(s.val()||{}));
    db.ref(`${r}/soundLibrary`).on('value',s=>setSoundLib(s.val()||{}));
    db.ref(`${r}/monitoring/cameras`).on('value',s=>setCameras(s.val()||{}));
    return()=>db.ref(r).off();
  },[cfg.roomId]);

  const curHeat=useMemo(()=>heats.find(h=>(h.no||h.heatNo)===heatNo)||heats[0]||null,[heats,heatNo]);
  const hIdx=useMemo(()=>heats.findIndex(h=>(h.no||h.heatNo)===heatNo),[heats,heatNo]);
  const comp=meta?.competition||cfg.roomId||'대회';

  const fbOp=useCallback((d)=>{if(!cfg.roomId)return;db.ref(`${cfg.roomId}/operator`).update({...d,updatedAt:Date.now()});});
  const fbSig=useCallback((t)=>{if(!cfg.roomId)return;db.ref(`${cfg.roomId}/signals/current`).set({type:t,ts:Date.now()});});
  const fbAnn=useCallback((ko,en)=>{if(!cfg.roomId)return;db.ref(`${cfg.roomId}/announcements/current`).set({text_ko:ko,text_en:en,lang,ts:Date.now()});});

  const goHeat=useCallback((no)=>{setHeatNo(no);setHState('idle');fbOp({currentHeatNo:no,heatStatus:'idle'});setMentTxt('');});

  const doCall=()=>{
    const no=curHeat?.no||curHeat?.heatNo||heatNo;
    const ev=curHeat?.event_name||curHeat?.event||'';
    const m=ment('call',{comp,heatNo:no,event:ev});
    setMentTxt(m.ko);setHState('calling');fbOp({heatStatus:'calling'});
    fbAnn(m.ko,m.en);speakBoth(m.ko,m.en,lang);SIG.recall();toast('📢 소집 안내 송출');
  };
  // 종목 음원 검색 (강력한 매칭: 정확/접두/코드/공백제거)
  const findEventSound=(heat)=>{
    if(!heat||!soundLib||Object.keys(soundLib).length===0)return null;
    const ev=heat.event||'';
    if(!ev)return null;

    // 1. 완전 일치
    if(soundLib[ev])return soundLib[ev];

    // 2. 정규화 비교 (공백/대소문자 무시)
    const norm=s=>String(s).toLowerCase().replace(/\s+/g,'').replace(/×/g,'x');
    const evNorm=norm(ev);
    for(const k of Object.keys(soundLib)){
      if(norm(k)===evNorm)return soundLib[k];
    }

    // 3. 접두 매칭 (코드 부분만)
    const evCode=ev.split(/\s+/)[0]; // "SRSS"
    for(const k of Object.keys(soundLib)){
      if(k.startsWith(evCode)||k.startsWith(ev))return soundLib[k];
    }

    // 4. 종목 코드만 매칭 (라이브러리 키도 코드로 시작하는 것)
    for(const k of Object.keys(soundLib)){
      const kCode=k.split(/\s+/)[0];
      if(kCode===evCode)return soundLib[k];
    }

    return null;
  };
  const currentSound=useMemo(()=>findEventSound(curHeat),[curHeat,soundLib]);

  // 종목 음원 통합 재생 (시작~종료가 한 트랙)
  const doPlayEventTrack=()=>{
    if(!currentSound){toast('이 종목 음원이 없습니다',true);return;}
    if(trackAudioRef.current){trackAudioRef.current.pause();trackAudioRef.current=null;}
    const audio=new Audio(currentSound.url);
    trackAudioRef.current=audio;
    setTrackPlaying(true);
    setHState('racing');
    fbOp({heatStatus:'racing'});
    fbSig('start');
    const m=ment('start',{comp});
    setMentTxt(m.ko);
    fbAnn(m.ko,m.en);
    audio.onended=()=>{
      setTrackPlaying(false);
      setHState('finished');
      fbOp({heatStatus:'finished'});
      const em=ment('end',{comp});
      setMentTxt(em.ko);fbAnn(em.ko,em.en);speakBoth(em.ko,em.en,lang);
      toast('✓ 종목 음원 재생 완료');
    };
    audio.onerror=()=>{
      setTrackPlaying(false);
      toast('음원 재생 실패',true);
    };
    audio.play().then(()=>{
      toast(`▶ ${curHeat?.event||''} 음원 재생`);
    }).catch(e=>{
      setTrackPlaying(false);
      toast('재생 실패: '+e.message,true);
    });
  };
  const doStopTrack=()=>{
    if(trackAudioRef.current){trackAudioRef.current.pause();trackAudioRef.current=null;}
    setTrackPlaying(false);
    toast('⏹ 음원 정지');
  };

  const doStart=()=>{
    // 종목 음원이 있으면 자동으로 통합 트랙 재생
    if(currentSound){doPlayEventTrack();return;}
    // 없으면 합성음 fallback
    const m=ment('start',{comp});setMentTxt(m.ko);setHState('racing');
    fbOp({heatStatus:'racing'});fbSig('start');fbAnn(m.ko,m.en);
    SIG.start();speakBoth(m.ko,m.en,lang);toast('▶ 시작 신호음 (합성음)');
  };
  const do30=()=>{fbSig('warn30');SIG.warn30();toast('⏰ 30초 경고음');};
  const doEnd=()=>{
    const m=ment('end',{comp});setMentTxt(m.ko);setHState('finished');
    fbOp({heatStatus:'finished'});fbSig('end');fbAnn(m.ko,m.en);
    SIG.end();speakBoth(m.ko,m.en,lang);toast('■ 종료 신호음');
  };
  const doRecall=()=>{fbSig('recall');SIG.recall();toast('🔔 재호출음');};
  const doNext=()=>{
    if(hIdx>=heats.length-1){toast('마지막 히트입니다');return;}
    const nxt=heats[hIdx+1];const no=nxt.no||nxt.heatNo;
    goHeat(no);
    setTimeout(()=>{
      const m=ment('call',{comp,heatNo:no,event:nxt.event_name||nxt.event||''});
      setMentTxt(m.ko);fbAnn(m.ko,m.en);speakBoth(m.ko,m.en,lang);
      fbOp({heatStatus:'calling',currentHeatNo:no});setHState('calling');
    },600);
  };
  const doOpen=()=>{
    const fst=heats[0];const ev=fst?.event_name||fst?.event||'';
    const m1=ment('open',{comp});const m2=ment('firstcall',{comp,event:ev});
    const ko=m1.ko+' '+m2.ko;const en=m1.en+' '+m2.en;
    setMentTxt(ko);fbAnn(ko,en);speakBoth(ko,en,lang);toast('🏆 대회 개회 선언');
  };
  const doClose=()=>{
    const m=ment('close',{comp});setMentTxt(m.ko);fbAnn(m.ko,m.en);speakBoth(m.ko,m.en,lang);toast('🏁 대회 폐회');
  };
  const doCustom=()=>{
    if(!customMent.trim())return;
    setMentTxt(customMent);fbAnn(customMent,'');speakBoth(customMent,'',lang);setCustomMent('');toast('📢 안내 방송 송출');
  };

  const readyCnt=Object.values(judges).filter(j=>j.ready).length;
  const onlineCnt=Object.values(judges).filter(j=>j.online&&Date.now()-j.lastSeen<15000).length;

  const ST_COLOR={idle:'#4a5568',calling:'#ffd60a',racing:'#00e5ff',finished:'#00ff88'};
  const ST_ICON={idle:'⏸',calling:'📢',racing:'▶',finished:'✓'};
  const ST_LABEL={idle:'대기',calling:'소집',racing:'진행',finished:'완료'};
  const sc=ST_COLOR[hState]||'#4a5568';

  return(<div style={{background:'#080C18',minHeight:'100vh'}}>
    {/* 헤더 */}
    <header style={{padding:'10px 16px',borderBottom:'1px solid rgba(255,255,255,.08)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,position:'sticky',top:0,zIndex:40,background:'rgba(8,12,24,.97)',backdropFilter:'blur(12px)'}}>
      <div style={{display:'flex',alignItems:'baseline',gap:10}}>
        <div className="fd" style={{fontSize:22}}>모두의 <span style={{color:'#00e5ff'}}>플레이</span></div>
        <div style={{fontSize:10,color:'rgba(255,255,255,.3)',letterSpacing:'.2em'}}>운영 앱 v2</div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        {/* 시계 */}
        <Clock/>
        {/* 언어 */}
        <div style={{display:'flex',gap:3,background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:7,padding:3}}>
          {['ko','en','both'].map(l=>(
            <button key={l} onClick={()=>{setLang(l);fbOp({lang:l});}}
              style={{fontSize:10,padding:'3px 8px',borderRadius:5,border:'none',cursor:'pointer',fontWeight:700,background:lang===l?'#00e5ff':'transparent',color:lang===l?'#000':'rgba(255,255,255,.45)'}}>
              {l==='ko'?'한':l==='en'?'ENG':'한+ENG'}
            </button>
          ))}
        </div>
        {/* 심판 */}
        <div style={{fontSize:11,padding:'4px 10px',borderRadius:6,background:'rgba(0,255,136,.1)',border:'1px solid rgba(0,255,136,.3)',color:'#00ff88'}}>
          ⚖ {readyCnt}준비/{onlineCnt}접속
        </div>
        {/* 연결 */}
        <div style={{fontSize:11,padding:'4px 10px',borderRadius:6,background:online?'rgba(0,229,255,.1)':'rgba(255,61,113,.1)',border:`1px solid ${online?'rgba(0,229,255,.3)':'rgba(255,61,113,.3)'}`,color:online?'#00e5ff':'#ff3d71'}}>
          {online?'🔗 ONLINE':'⚠ OFFLINE'}
        </div>
        <button onClick={()=>setCfg(c=>({...c,showCfg:true}))} style={{fontSize:11,padding:'4px 10px',borderRadius:6,border:'1px solid rgba(255,255,255,.15)',background:'transparent',color:'rgba(255,255,255,.5)',cursor:'pointer'}}>⚙</button>
      </div>
    </header>

    <main style={{padding:'12px 16px 60px',maxWidth:1440,margin:'0 auto'}}>
      {!cfg.roomId||!online?(
        <div style={{textAlign:'center',padding:'60px 20px'}}>
          <div style={{fontSize:60,marginBottom:16}}>📡</div>
          <div className="fd" style={{fontSize:28,color:'rgba(255,255,255,.7)',marginBottom:8}}>Setup에서 만든 Room ID로 연결하세요</div>
          <button onClick={()=>setCfg(c=>({...c,showCfg:true}))} style={{background:'#00e5ff',color:'#000',border:'none',borderRadius:10,padding:'12px 28px',fontSize:16,fontWeight:700,cursor:'pointer'}}>설정 열기 ⚙</button>
        </div>
      ):(
        <>
        {/* ── 현재 히트 ── */}
        <div style={{borderRadius:12,border:`2px solid ${sc}40`,background:`linear-gradient(135deg,${sc}10,transparent)`,padding:'14px 18px',marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
            <div style={{display:'flex',alignItems:'baseline',gap:14}}>
              <div>
                <div style={{fontSize:10,letterSpacing:'.3em',color:sc,textTransform:'uppercase'}}>CURRENT</div>
                <div className="fd" style={{fontSize:50,lineHeight:.9}}>HEAT {curHeat?.no||curHeat?.heatNo||'—'}</div>
              </div>
              <div>
                <div style={{fontSize:14,fontWeight:700,color:'rgba(255,255,255,.85)'}}>{curHeat?.event_name||curHeat?.event||'—'}</div>
                <div style={{fontSize:12,color:'rgba(255,255,255,.45)'}}>{curHeat?.division||'—'}</div>
              </div>
              <div style={{padding:'4px 12px',borderRadius:20,background:`${sc}20`,border:`1px solid ${sc}50`,fontSize:12,color:sc,fontWeight:700}}>
                {ST_ICON[hState]} {ST_LABEL[hState]}
              </div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <button onClick={()=>{if(hIdx>0)goHeat(heats[hIdx-1].no||heats[hIdx-1].heatNo);}} disabled={hIdx<=0}
                style={{padding:'9px 16px',borderRadius:8,border:'1px solid rgba(255,255,255,.15)',background:'rgba(255,255,255,.05)',color:'rgba(255,255,255,.7)',fontSize:13,fontWeight:700,cursor:hIdx<=0?'not-allowed':'pointer',opacity:hIdx<=0?.4:1}}>← 이전</button>
              <select value={curHeat?.no||curHeat?.heatNo||1} onChange={e=>goHeat(parseInt(e.target.value))}
                style={{background:'rgba(0,0,0,.5)',border:'1px solid rgba(255,255,255,.15)',color:'#fff',padding:'9px 12px',borderRadius:8,fontSize:12,fontFamily:'JetBrains Mono,monospace'}}>
                {heats.map(h=><option key={h.no||h.heatNo} value={h.no||h.heatNo}>HEAT {h.no||h.heatNo} · {h.event}</option>)}
              </select>
              <button onClick={()=>{if(hIdx<heats.length-1)goHeat(heats[hIdx+1].no||heats[hIdx+1].heatNo);}} disabled={hIdx>=heats.length-1}
                style={{padding:'9px 16px',borderRadius:8,border:`1px solid ${sc}60`,background:`${sc}18`,color:sc,fontSize:13,fontWeight:700,cursor:hIdx>=heats.length-1?'not-allowed':'pointer',opacity:hIdx>=heats.length-1?.4:1}}>다음 →</button>
            </div>
          </div>
        </div>

        {/* ── 워크플로우 + 멘트 + 코트 보드 (통합 레이아웃) ── */}
        <div style={{display:'grid',gridTemplateColumns:'300px 1fr',gap:10,marginBottom:10}}>

          {/* 왼쪽: 워크플로우 컴팩트 */}
          <div style={{background:'rgba(255,255,255,.02)',border:'1px solid rgba(255,255,255,.08)',borderRadius:12,padding:12,display:'flex',flexDirection:'column',gap:6}}>
            <div style={{fontSize:10,letterSpacing:'.2em',color:'rgba(255,255,255,.35)',marginBottom:4,textTransform:'uppercase'}}>진행 워크플로우</div>

            {/* 개회/폐회 */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:5}}>
              <WBtn icon="🏆" label="대회 개회" desc="개회사+첫 소집" color="#ffd60a" onClick={doOpen}/>
              <WBtn icon="🏁" label="대회 폐회" desc="폐회사" color="#64748b" onClick={doClose}/>
            </div>

            <div style={{borderTop:'1px solid rgba(255,255,255,.07)'}}/>

            {/* 소집 */}
            <WBtn icon="📢" label={`소집 · HEAT ${curHeat?.no||curHeat?.heatNo||'—'}`}
              desc="선수 입장 안내 + 음성" color="#ffd60a" big active={hState==='calling'} onClick={doCall}/>

            {/* 음원 재생 */}
            <WBtn icon={currentSound?'🎵':'▶'}
              label={currentSound?`음원 재생 · ${(curHeat?.event||'').split(' ')[0]}`:'시작 신호음'}
              desc={currentSound?`📎 ${currentSound.name}`:`음원 없음 · 합성음 (${Object.keys(soundLib).length}개)`}
              color="#00e5ff" big active={hState==='racing'||trackPlaying} onClick={doStart}/>

            {/* 강제 정지 */}
            {trackPlaying&&(
              <button onClick={doStopTrack} className="wf-btn"
                style={{borderColor:'#ff3d71',background:'rgba(255,61,113,.15)',color:'#ff3d71',cursor:'pointer'}}>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <span>⏹</span><span style={{fontSize:12,fontWeight:700}}>음원 강제 정지</span>
                </div>
              </button>
            )}

            {/* 종료 + 다음 */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:5}}>
              <WBtn icon="■" label="종료 신호음" desc="퇴장 안내+음성" color="#00ff88" big active={hState==='finished'} onClick={doEnd}/>
              <WBtn icon="⏭" label="다음 히트" desc={hIdx>=heats.length-1?"마지막":`→ HEAT ${(curHeat?.no||curHeat?.heatNo||0)+1}`}
                color="#a78bfa" big disabled={hIdx>=heats.length-1} onClick={doNext}/>
            </div>

            <div style={{borderTop:'1px solid rgba(255,255,255,.07)'}}/>

            {/* 멘트 표시 */}
            <div style={{padding:'8px 10px',background:'rgba(255,214,10,.05)',border:'1px solid rgba(255,214,10,.15)',borderRadius:7,fontSize:11,lineHeight:1.7,color:'#fef9c3',minHeight:50}}>
              {mentTxt||<span style={{color:'rgba(255,255,255,.25)'}}>진행 버튼을 누르면 자동 생성</span>}
            </div>

            {/* 직접 입력 */}
            <textarea value={customMent} onChange={e=>setCustomMent(e.target.value)} rows={2}
              placeholder="직접 안내 멘트..."
              style={{width:'100%',background:'rgba(0,0,0,.3)',border:'1px solid rgba(255,255,255,.1)',borderRadius:7,padding:'8px 10px',fontSize:12,color:'#fff',resize:'none',fontFamily:'Pretendard,sans-serif'}}/>
            <button onClick={doCustom}
              style={{padding:'8px',background:'rgba(0,229,255,.12)',border:'1px solid rgba(0,229,255,.3)',borderRadius:7,color:'#00e5ff',fontSize:12,fontWeight:700,cursor:'pointer'}}>
              📢 안내 방송 송출
            </button>
          </div>

          {/* 오른쪽: 코트 보드 */}
          <div>
            {/* 상태 요약 바 */}
            <div style={{display:'flex',gap:8,marginBottom:8,flexWrap:'wrap',alignItems:'center'}}>
              <div style={{fontSize:10,letterSpacing:'.3em',color:'#00e5ff',textTransform:'uppercase',fontFamily:'Bebas Neue,sans-serif',fontSize:16}}>코트 진행 보드</div>
              <div style={{marginLeft:'auto',display:'flex',gap:6}}>
                {/* 준비 현황 */}
                <div style={{fontSize:11,padding:'3px 10px',borderRadius:20,background:'rgba(0,255,136,.1)',border:'1px solid rgba(0,255,136,.3)',color:'#00ff88'}}>
                  ⚖ {readyCnt}명 READY
                </div>
                {/* 카메라 현황 */}
                <div style={{fontSize:11,padding:'3px 10px',borderRadius:20,background:'rgba(0,229,255,.1)',border:'1px solid rgba(0,229,255,.3)',color:'#00e5ff'}}>
                  📷 {Object.values(cameras).filter(c=>c.online&&Date.now()-c.lastSeen<15000).length}대 연결
                </div>
                {/* 모두 준비 시 강조 */}
                {curHeat&&readyCnt>0&&readyCnt>=Object.keys(curHeat.courts||{}).length&&(
                  <div style={{fontSize:11,padding:'3px 10px',borderRadius:20,background:'rgba(0,255,136,.25)',border:'1px solid #00ff88',color:'#00ff88',fontWeight:700,animation:'pulse 1s ease-in-out infinite'}}>
                    ✅ 모두 준비 완료 · 음원 재생 가능
                  </div>
                )}
              </div>
            </div>
            <CourtLayout curHeat={curHeat} layout={layout} cMode={cMode} judges={judges} cameras={cameras}/>
          </div>
        </div>

        {/* ── 하단 요약 ── */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:8}}>
          {[{l:'대회',v:meta?.competition||'—'},{l:'총 선수',v:`${Object.keys(athletes).length}명`},{l:'총 히트',v:`${heats.length}히트`},{l:'현재 위치',v:`${hIdx+1}/${heats.length}`},{l:'접속 심판',v:`${onlineCnt}명`},{l:'준비 완료',v:`${readyCnt}명`}]
            .map(c=>(<div key={c.l} style={{background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.08)',borderRadius:10,padding:'10px 14px'}}>
              <div style={{fontSize:10,letterSpacing:'.1em',color:'rgba(255,255,255,.4)',textTransform:'uppercase'}}>{c.l}</div>
              <div className="fd" style={{fontSize:20,marginTop:2}}>{c.v}</div>
            </div>))}
        </div>
        </>
      )}
    </main>

    {/* 토스트 */}
    <div className="toast-wrap">
      {toasts.map(t=>(
        <div key={t.id} className="toast-item"
          style={{background:t.tp==='error'?'rgba(255,61,113,.2)':'rgba(0,229,255,.12)',border:`1px solid ${t.tp==='error'?'rgba(255,61,113,.4)':'rgba(0,229,255,.3)'}`,color:t.tp==='error'?'#ff8fa3':'#a5f3fc'}}>
          {t.msg}
        </div>
      ))}
    </div>

    {cfg.showCfg&&<CfgModal cfg={cfg} setCfg={setCfg}/>}
  </div>);
}

// ── 시계 ──
function Clock(){const [t,setT]=useState(new Date());useEffect(()=>{const id=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(id);},[]);return<div className="fm" style={{fontSize:20,color:'#67e8f9'}}>{t.toLocaleTimeString('ko-KR',{hour12:false})};</div>;}

// ── 워크플로우 버튼 ──
function WBtn({icon,label,desc,color,onClick,active,disabled,big}){
  return(<button onClick={!disabled?onClick:undefined} className="wf-btn"
    style={{marginBottom:big?0:0,borderColor:`${color}${active?'':50}`,background:`${color}${active?25:10}`,color:active?color:`${color}bb`,cursor:disabled?'not-allowed':'pointer',opacity:disabled?.4:1}}>
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <span style={{fontSize:big?17:14}}>{icon}</span>
      <div>
        <div style={{fontSize:big?13:12,fontWeight:700}}>{label}</div>
        {desc&&<div style={{fontSize:10,opacity:.6,marginTop:1}}>{desc}</div>}
      </div>
      {active&&<span style={{marginLeft:'auto',fontSize:9,color,fontWeight:700}} className="pulse">● 진행중</span>}
    </div>
  </button>);
}

// ── 코트 레이아웃 ──
function CourtLayout({curHeat,layout,cMode,judges,cameras}){
  const athMap=useMemo(()=>{
    const m={};if(!curHeat?.courts)return m;
    Object.entries(curHeat.courts).forEach(([k,c])=>m[k]=c.athlete||null);return m;
  },[curHeat]);

  const cl=layout||{mode:'station',stations:6,cps:4,stationCols:2,sides:2};
  const total=cl.mode==='station'?cl.stations*cl.cps:(cl.gridCols||4)*(cl.gridRows||2);
  const courts=Array.from({length:total},(_,i)=>cId(i,cMode));

  const CourtBox=({cid})=>{
    const ath=athMap[cid];
    const js=judges[cid]||{};
    const cs=cameras[cid]||{};
    const now=Date.now();
    const judgeOnline=js.online&&now-js.lastSeen<15000;
    const camOnline=cs.online&&now-cs.lastSeen<15000;
    const isReady=js.ready;
    const isSubmitted=js.submitted;

    // 배경색 결정
    let bg='rgba(255,255,255,.03)';
    let border='rgba(255,255,255,.08)';
    if(isSubmitted){bg='rgba(0,255,136,.1)';border='rgba(0,255,136,.6)';}
    else if(isReady){bg='rgba(0,255,136,.06)';border='rgba(0,255,136,.4)';}
    else if(ath){bg='rgba(0,229,255,.05)';border='rgba(0,229,255,.3)';}

    return(
      <div style={{background:bg,border:`1.5px solid ${border}`,borderRadius:8,padding:'8px',minHeight:80,transition:'all .2s'}}>
        {/* 코트 번호 + 상태 아이콘 */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
          <div className="fd" style={{fontSize:17,color:'#00e5ff',lineHeight:1}}>{cid}</div>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            {/* 카메라 */}
            <span title={camOnline?'카메라 연결됨':'카메라 미연결'}
              style={{fontSize:11,opacity:camOnline?1:.25}}>
              {camOnline?'📷':'📷'}
            </span>
            {/* 심판 */}
            <span title={judgeOnline?(isReady?'심판 준비 완료':'심판 접속 중'):'심판 미접속'}
              style={{fontSize:11,opacity:judgeOnline?1:.25}}>
              {judgeOnline?(isReady?'✅':'⚖'):'⚖'}
            </span>
            {/* 점수 제출 */}
            {isSubmitted&&<span style={{fontSize:10,color:'#00ff88',fontWeight:700,fontFamily:'monospace'}}>✓{js.score}</span>}
          </div>
        </div>

        {/* 선수 정보 */}
        {ath?(
          <>
            <div style={{display:'flex',gap:5,alignItems:'baseline'}}>
              <span className="fm" style={{fontSize:9,color:'rgba(255,255,255,.35)'}}>#{ath.bib}</span>
              <span style={{fontSize:11,fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{ath.name}</span>
            </div>
            <div style={{fontSize:9,color:'rgba(255,255,255,.3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ath.club||''}</div>
            {/* 상태 뱃지 */}
            {(isReady||isSubmitted)&&(
              <div style={{marginTop:3,fontSize:9,fontWeight:700,
                color:isSubmitted?'#00ff88':'#ffd60a',
                background:isSubmitted?'rgba(0,255,136,.1)':'rgba(255,214,10,.1)',
                padding:'1px 5px',borderRadius:3,display:'inline-block'}}>
                {isSubmitted?`✓ ${js.score}점 제출`:'✋ READY'}
              </div>
            )}
          </>
        ):(
          <div style={{fontSize:18,color:'rgba(255,255,255,.1)',textAlign:'center',marginTop:8}}>✕</div>
        )}
      </div>
    );
  };

  const StBox=({label,rows,cpsRow})=>(<div className="st-box">
    <div className="st-lbl">{label}</div>
    {rows.map((row,ri)=>(
      <div key={ri} style={{display:'grid',gridTemplateColumns:`repeat(${cpsRow},1fr)`,gap:5,marginBottom:5}}>
        {row.map(c=><CourtBox key={c} cid={c}/>)}
      </div>
    ))}
  </div>);

  if(cl.mode==='station'){
    const cpsRow=cl.stationCols||2;
    const cpsRows=Math.ceil(cl.cps/cpsRow);
    const buildSt=(startIdx)=>{const rows=[];let i=startIdx;for(let r=0;r<cpsRows;r++){const row=[];for(let c=0;c<cpsRow;c++){if(i<courts.length)row.push(courts[i++]);}rows.push(row);}return rows;};
    if(cl.sides===2){
      const sps=Math.ceil(cl.stations/2);let i=0;
      const R=[],L=[];
      for(let s=0;s<sps;s++){R.push(buildSt(i));i+=cl.cps;}
      for(let s=0;s<(cl.stations-sps);s++){L.push(buildSt(i));i+=cl.cps;}
      return(<div style={{display:'grid',gridTemplateColumns:'1fr 3px 1fr',gap:10,alignItems:'start'}}>
        <div>{L.map((st,si)=><StBox key={si} label={`ST ${sps+si+1}`} rows={st} cpsRow={cpsRow}/>)}</div>
        <div style={{background:'rgba(0,229,255,.2)',borderRadius:4,height:'100%'}}/>
        <div>{R.map((st,si)=><StBox key={si} label={`ST ${si+1}`} rows={st} cpsRow={cpsRow}/>)}</div>
      </div>);
    }
    let i=0;
    return(<div>{Array.from({length:cl.stations},(_,si)=>{const rows=buildSt(i);i+=cl.cps;return<StBox key={si} label={`ST ${si+1}`} rows={rows} cpsRow={cpsRow}/>;})}</div>);
  }
  return(<div style={{display:'flex',flexDirection:'column',gap:6}}>
    {Array.from({length:cl.gridRows||2},(_,ri)=>(
      <div key={ri} style={{display:'grid',gridTemplateColumns:`repeat(${cl.gridCols||4},1fr)`,gap:6}}>
        {Array.from({length:cl.gridCols||4},(_,ci)=>{const c=courts[ri*(cl.gridCols||4)+ci];return c?<CourtBox key={c} cid={c}/>:null;})}
      </div>
    ))}
  </div>);
}

// ── 설정 모달 ──
function CfgModal({cfg,setCfg}){
  const [tmp,setTmp]=useState({...cfg});
  const save=()=>{localStorage.setItem('mop_op_roomid',tmp.roomId||'');localStorage.setItem('mop_op_name',tmp.name||'');setCfg({...tmp,showCfg:false});};
  return(<div style={{position:'fixed',inset:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,.8)',backdropFilter:'blur(12px)',padding:20}}>
    <div style={{width:'100%',maxWidth:420,background:'#0d1117',border:'1px solid rgba(255,255,255,.12)',borderRadius:20,padding:24}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div className="fd" style={{fontSize:24}}>운영 앱 설정</div>
        <button onClick={()=>setCfg(c=>({...c,showCfg:false}))} style={{background:'none',border:'none',color:'rgba(255,255,255,.5)',fontSize:20,cursor:'pointer'}}>✕</button>
      </div>
      {[{l:'Firebase Room ID',ph:'Setup의 Room ID',k:'roomId',mono:true},{l:'운영자 이름',ph:'홍길동',k:'name'}].map(f=>(
        <div key={f.k} style={{marginBottom:14}}>
          <div style={{fontSize:11,color:'rgba(255,255,255,.5)',letterSpacing:'.1em',marginBottom:6}}>{f.l}</div>
          <input value={tmp[f.k]||''} onChange={e=>setTmp(t=>({...t,[f.k]:e.target.value}))} placeholder={f.ph}
            style={{width:'100%',background:'rgba(0,0,0,.4)',border:'1px solid rgba(255,255,255,.1)',borderRadius:8,padding:'11px 14px',fontSize:14,color:'#fff',fontFamily:f.mono?'monospace':'inherit'}}/>
        </div>
      ))}
      <div style={{padding:12,background:'rgba(0,229,255,.05)',border:'1px solid rgba(0,229,255,.2)',borderRadius:8,fontSize:11,color:'rgba(0,229,255,.8)',lineHeight:1.7,marginBottom:14}}>
        ✅ Phase 2 기능<br/>
        · 히트 워크플로우 (소집→시작→종료→다음)<br/>
        · TTS 음성 안내 (한/영/한+영 선택)<br/>
        · 신호음 (시작/30초/종료/재호출)<br/>
        · 심판 준비 상태 실시간 모니터링<br/>
        · 직접 입력 안내 방송<br/>
        · 뷰어 announcements 연동<br/>
        · 대회 개회/폐회 선언
      </div>
      <button onClick={save} style={{width:'100%',padding:'13px',background:'#00e5ff',border:'none',borderRadius:10,fontSize:16,fontWeight:700,color:'#000',cursor:'pointer'}}>저장 및 연결</button>
    </div>
  </div>);
}

document.addEventListener('touchstart',()=>{try{ac();}catch(e){}},{once:true});
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
