<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>모두의 플레이 — 전광판</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#03050C;color:#fff;font-family:'Noto Sans KR',sans-serif;overflow:hidden;}

#app{display:flex;flex-direction:column;width:100vw;height:100vh;}

/* ── 상단 바 (대회명 + 페이지) ── */
#top-bar{
  height:38px;flex-shrink:0;
  background:linear-gradient(135deg,#050D1F,#091428);
  border-bottom:1px solid rgba(0,229,255,.2);
  display:flex;align-items:center;
  padding:0 14px;gap:12px;
}
.top-comp{
  font-family:'Bebas Neue',sans-serif;
  font-size:18px;color:#00e5ff;letter-spacing:.06em;
  text-shadow:0 0 18px rgba(0,229,255,.4);white-space:nowrap;
}
.top-sep{width:1px;height:18px;background:rgba(0,229,255,.2);flex-shrink:0;}
.top-page{
  font-size:11px;font-weight:700;
  padding:4px 12px;border-radius:20px;
  background:rgba(0,229,255,.1);
  color:#00e5ff;border:1px solid rgba(0,229,255,.3);
  white-space:nowrap;flex-shrink:0;
  cursor:pointer;transition:all .15s;
  display:inline-flex;align-items:center;gap:5px;
}
.top-page:hover{background:rgba(0,229,255,.2);transform:scale(1.03);}
.top-page-arrow{font-size:9px;opacity:.6;}
.top-spacer{flex:1;}
#top-logo{height:24px;opacity:.85;flex-shrink:0;}

/* 메인 영역 = 영상(풀사이즈) + 사이드바(오버레이) */
#main-area{flex:1;min-height:0;display:flex;overflow:hidden;position:relative;}

#video-area{
  flex:1;min-width:0;
  position:relative;
}

/* 사이드바 — 영상 위에 떠 있는 오버레이 */
#sidebar{
  position:absolute;top:0;left:0;bottom:0;
  width:240px;z-index:20;
  background:linear-gradient(180deg,rgba(5,13,31,.94),rgba(0,8,20,.92));
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-right:1px solid rgba(0,229,255,.25);
  box-shadow:8px 0 30px rgba(0,0,0,.4);
  display:flex;flex-direction:column;
  overflow:visible;
  transition:width .55s cubic-bezier(.22,.68,0,1.2);
}
#sidebar > .sb-heat-section,
#sidebar > .sb-rank-section{
  /* 내부 컨텐츠는 사이드바 안에 갇힘 */
  overflow:hidden;
}
@media (min-width:2200px){#sidebar{width:320px;}}
@media (max-width:1500px){#sidebar{width:200px;}}

/* 축소(좁아짐) — HEAT 정보만 작게, 사이드바는 화면에 남음 */
#sidebar.collapsed{
  width:80px;
  transform:none; /* 슬라이드 X, 너비만 줄임 */
}
#sidebar.collapsed .sb-rank-section{display:none;}
#sidebar.collapsed .sb-event,
#sidebar.collapsed .sb-div,
#sidebar.collapsed .sb-status-pill{display:none;}
#sidebar.collapsed .sb-heat-num{font-size:30px;}
#sidebar.collapsed .sb-heat-section{padding:14px 6px;text-align:center;}
#sidebar.collapsed .sb-heat-lbl{font-size:8px;letter-spacing:.15em;}

/* 토글 버튼 — 사이드바 하단 가운데 */
#sb-toggle{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  width:44px;height:32px;
  background:rgba(0,229,255,.15);
  border:1.5px solid rgba(0,229,255,.4);
  border-radius:8px;
  color:#00e5ff;font-size:13px;
  cursor:pointer;z-index:30;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
  font-family:'Bebas Neue',sans-serif;
  letter-spacing:.05em;
}
#sb-toggle:hover{
  background:rgba(0,229,255,.3);
  transform:translateX(-50%) scale(1.05);
}
#sidebar.collapsed #sb-toggle{
  width:32px;height:32px;font-size:11px;
}

/* HEAT 정보 섹션 (운영앱처럼 크게) */
.sb-heat-section{
  padding:14px 14px 12px;
  background:linear-gradient(135deg,rgba(255,214,10,.08),transparent);
  border-bottom:1px solid rgba(255,214,10,.15);
}
.sb-heat-lbl{font-size:9px;letter-spacing:.3em;color:#ffd60a;text-transform:uppercase;margin-bottom:2px;}
.sb-heat-num{font-family:'Bebas Neue',sans-serif;font-size:50px;color:#ffd60a;line-height:.9;text-shadow:0 0 24px rgba(255,214,10,.4);}
.sb-event{font-size:13px;font-weight:700;color:#fff;margin-top:7px;line-height:1.3;}
.sb-div{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px;}
.sb-status-pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:8px;}
.st-idle{background:rgba(74,85,104,.3);color:#718096;}
.st-calling{background:rgba(255,214,10,.2);color:#ffd60a;}
.st-racing{background:rgba(0,229,255,.2);color:#00e5ff;}
.st-finished{background:rgba(0,255,136,.2);color:#00ff88;}

/* 순위 섹션 */
.sb-rank-section{
  flex:1;min-height:0;
  padding:10px 10px 60px;
  display:flex;flex-direction:column;overflow:hidden;
}

/* 탭 (순위 / 시상등급) */
.sb-tabs{
  display:flex;gap:4px;margin-bottom:8px;
}
.sb-tab{
  flex:1;padding:7px 4px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:7px;
  color:rgba(255,255,255,.45);
  font-size:11px;font-weight:700;cursor:pointer;
  transition:all .15s;
  font-family:'Noto Sans KR',sans-serif;
}
.sb-tab.active{
  background:rgba(0,229,255,.18);
  border-color:rgba(0,229,255,.5);
  color:#00e5ff;
}
.sb-tab:hover{background:rgba(255,255,255,.08);}
.sb-tab.active:hover{background:rgba(0,229,255,.28);}

/* 페이지/등급 버튼 */
.sb-page-btns{
  display:flex;gap:3px;margin-bottom:8px;flex-wrap:wrap;
}
.sb-pg{
  flex:1;min-width:0;padding:5px 3px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  border-radius:5px;
  color:rgba(255,255,255,.5);
  font-size:10px;font-weight:700;cursor:pointer;
  font-family:'Bebas Neue',sans-serif;letter-spacing:.05em;
  transition:all .15s;
}
.sb-pg.active{
  background:rgba(0,229,255,.15);
  border-color:rgba(0,229,255,.4);
  color:#00e5ff;
}
.sb-pg:hover{background:rgba(255,255,255,.06);}

/* 시상등급 표시 (순위 모드에서) */
.rank-award-tag{
  font-size:9px;font-weight:700;
  padding:1px 5px;border-radius:4px;
  margin-left:4px;
}
.rank-award-grand{background:rgba(255,214,10,.25);color:#ffd60a;}
.rank-award-gold{background:rgba(218,165,32,.2);color:#daa520;}
.rank-award-silver{background:rgba(192,192,192,.2);color:#c0c0c0;}
.rank-award-bronze{background:rgba(205,127,50,.2);color:#cd7f32;}
.sb-rank-title{
  font-family:'Bebas Neue',sans-serif;font-size:12px;
  color:#00e5ff;letter-spacing:.3em;
  margin-bottom:8px;padding-left:4px;
  display:flex;align-items:center;gap:6px;
}
.sb-rank-list{
  flex:1;display:flex;flex-direction:column;gap:4px;
  overflow:hidden;position:relative;
}

/* 순위 아이템 — 슬라이드 애니메이션 */
.sb-rank-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 8px;border-radius:6px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.05);
  position:relative;
  /* FLIP 애니메이션을 위한 transition */
  transition:transform .6s cubic-bezier(.22,.68,0,1.2);
}
.sb-rank-item.rank-1{
  background:linear-gradient(90deg,rgba(255,214,10,.15),rgba(255,214,10,.03));
  border-color:rgba(255,214,10,.4);
}
.sb-rank-item.rank-2{background:linear-gradient(90deg,rgba(148,163,184,.12),transparent);border-color:rgba(148,163,184,.3);}
.sb-rank-item.rank-3{background:linear-gradient(90deg,rgba(205,124,84,.12),transparent);border-color:rgba(205,124,84,.3);}
.sb-r-num{font-family:'Bebas Neue',sans-serif;font-size:16px;width:20px;text-align:center;flex-shrink:0;line-height:1;}
.sb-r-num.gold{color:#ffd60a;text-shadow:0 0 8px rgba(255,214,10,.5);}
.sb-r-num.silver{color:#94a3b8;}
.sb-r-num.bronze{color:#cd7c54;}
.sb-r-num.other{color:rgba(255,255,255,.4);}
.sb-r-cid{font-family:'Bebas Neue',sans-serif;font-size:11px;color:rgba(0,229,255,.55);width:24px;flex-shrink:0;}
.sb-r-info{flex:1;min-width:0;}
.sb-r-name{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-r-club{font-size:9px;color:rgba(255,255,255,.4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-r-score{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#00e5ff;flex-shrink:0;line-height:1;}

/* ── 코트 그리드 ── */
#courts-wrap{
  position:absolute;
  top:6px;right:6px;bottom:6px;left:246px;
  display:grid;gap:5px;
  transition:left .55s cubic-bezier(.22,.68,0,1.2),opacity .35s ease;
  grid-auto-rows:0 !important;
  grid-auto-columns:0 !important;
  overflow:hidden;
}
#sidebar.collapsed ~ #video-area #courts-wrap{
  left:86px;
}
@media (min-width:2200px){
  #courts-wrap{left:326px;}
  #sidebar.collapsed ~ #video-area #courts-wrap{left:86px;}
}
@media (max-width:1500px){
  #courts-wrap{left:206px;}
  #sidebar.collapsed ~ #video-area #courts-wrap{left:86px;}
}
.layout-12{
  grid-template-columns:repeat(6,minmax(0,1fr)) !important;
  grid-template-rows:repeat(2,minmax(0,1fr)) !important;
}
.layout-4{
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  grid-template-rows:repeat(2,minmax(0,1fr)) !important;
}
.layout-1{
  grid-template-columns:1fr !important;
  grid-template-rows:1fr !important;
}

/* 코트 카드 — 셀 채우기 (영상 비율은 video object-fit 처리) */
.court-card{
  background:#080C18;
  border:1px solid rgba(255,255,255,.08);
  border-radius:4px;
  position:relative;overflow:hidden;
  transition:border-color .3s;
  width:100%;height:100%;
  min-width:0;min-height:0;
}
.court-card.has-signal{border-color:rgba(0,229,255,.25);}
.court-card.has-score{border-color:rgba(0,255,136,.35);}

/* 영상 = 셀 전체 채움 (cover) */
.video-wrap{
  position:absolute;inset:0;
  background:#000;
}
.video-wrap video{
  width:100%;height:100%;
  object-fit:cover; /* 9:16 영상이 셀에 맞춰 cover */
  display:block;
}
.no-signal{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(10px,1.5vw,16px);
  color:rgba(255,255,255,.12);letter-spacing:.2em;
}

/* 코트 ID 오버레이 (좌상단) */
.court-id-badge{
  position:absolute;top:6px;left:8px;z-index:3;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(16px,2.2vw,28px);
  color:#00e5ff;line-height:1;
  text-shadow:0 0 14px rgba(0,229,255,.8),0 2px 6px rgba(0,0,0,.9);
  pointer-events:none;
}

/* 정보 오버레이 (반투명 그라데이션, 영상 위) */
.info-overlay{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,.5) 60%,transparent);
  padding:14px 8px 6px;
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:6px;
  pointer-events:none;
}
.info-left{flex:1;min-width:0;}
.info-name{
  font-size:clamp(11px,1.4vw,16px);
  font-weight:800;color:#fff;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1.2;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
}
.info-club{
  font-size:clamp(8px,1vw,11px);
  color:rgba(255,255,255,.7);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1.2;margin-top:2px;
  text-shadow:0 1px 3px rgba(0,0,0,.9);
}
.info-score{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(24px,4.5vw,56px);
  color:#00e5ff;line-height:1;
  text-shadow:0 0 18px rgba(0,229,255,.6),0 2px 6px rgba(0,0,0,.9);
  flex-shrink:0;
  transition:color .15s,transform .15s;
}
.info-score.bump{
  color:#00ff88;
  text-shadow:0 0 24px rgba(0,255,136,.7),0 2px 6px rgba(0,0,0,.9);
  transform:scale(1.08);
}

/* 4분할에서는 더 큰 정보 */
.layout-4 .court-id-badge{font-size:clamp(24px,3.5vw,42px);}
.layout-4 .info-name{font-size:clamp(16px,2.4vw,28px);}
.layout-4 .info-club{font-size:clamp(11px,1.4vw,16px);}
.layout-4 .info-score{font-size:clamp(48px,8vw,100px);}
.layout-4 .info-overlay{padding:30px 14px 10px;}

/* 1분할 풀스크린 */
.layout-1 .court-id-badge{font-size:clamp(36px,5vw,60px);top:14px;left:18px;}
.layout-1 .info-name{font-size:clamp(22px,3.5vw,40px);}
.layout-1 .info-club{font-size:clamp(14px,1.8vw,22px);}
.layout-1 .info-score{font-size:clamp(70px,14vw,180px);}
.layout-1 .info-overlay{padding:60px 24px 18px;}

.info-name,.sb-r-name,.ath-name-sm{
  font-family:'Noto Sans KR','Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;
}

#ann-popup{
  display:none;position:fixed;
  bottom:60px;left:50%;transform:translateX(-50%);z-index:999;
  background:rgba(3,8,25,.97);
  border:2px solid rgba(0,229,255,.7);
  border-radius:16px;padding:20px 36px;
  max-width:820px;width:92%;
  box-shadow:0 0 60px rgba(0,229,255,.25);
  backdrop-filter:blur(16px);
  text-align:center;animation:annPop .4s cubic-bezier(.22,.68,0,1.2);
}
#ann-icon{font-size:26px;margin-bottom:7px;}
#ann-text{font-size:clamp(18px,3vw,26px);font-weight:700;color:#fff;line-height:1.7;}
#ann-text-en{font-size:clamp(12px,1.8vw,17px);color:rgba(0,229,255,.65);margin-top:6px;font-style:italic;}
#ann-bar{height:3px;background:rgba(0,229,255,.15);border-radius:3px;margin-top:12px;overflow:hidden;}
#ann-fill{height:100%;background:linear-gradient(90deg,#00e5ff,#00ff88);transform-origin:left;}
@keyframes annPop{from{opacity:0;transform:translateX(-50%) translateY(28px) scale(.95);}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}}

/* 설정 모달 */
#cfg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;align-items:center;justify-content:center;}
#cfg.show{display:flex;}
.cfg-box{background:#0d1117;border:1px solid rgba(0,229,255,.3);border-radius:16px;padding:24px;width:380px;max-width:92vw;}
.cfg-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#00e5ff;margin-bottom:16px;text-align:center;}
.cfg-lbl{font-size:10px;color:#718096;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;margin-top:10px;}
.cfg-inp{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 14px;font-size:14px;color:#fff;font-family:monospace;}
.cfg-row{display:flex;gap:8px;}
.cfg-pg-btn{flex:1;padding:10px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;}
.cfg-pg-btn.active{background:rgba(0,229,255,.2);border-color:#00e5ff;color:#00e5ff;}
.cfg-btn{width:100%;padding:12px;background:#00e5ff;border:none;border-radius:10px;font-size:15px;font-weight:700;color:#000;cursor:pointer;margin-top:14px;}
</style>
</head>
<body>

<div id="cfg">
  <div class="cfg-box">
    <div class="cfg-title">📺 전광판 설정</div>
    <div class="cfg-lbl">Room ID</div>
    <input class="cfg-inp" id="inp-room" placeholder="예: room_001">
    <div class="cfg-lbl">대회 로고 URL (선택)</div>
    <input class="cfg-inp" id="inp-logo" placeholder="https://...logo.png">
    <button class="cfg-btn" onclick="saveConfig()">저장 및 시작</button>
  </div>
</div>

<button onclick="document.getElementById('cfg').classList.add('show')"
  style="position:fixed;top:6px;right:8px;z-index:200;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.3);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;">⚙</button>

<div id="app">
  <!-- 상단 바 -->
  <div id="top-bar">
    <img id="top-logo" src="" alt="" style="display:none">
    <span class="top-comp" id="top-comp">모두의 플레이</span>
    <div class="top-sep"></div>
    <span class="top-page" id="top-page" onclick="switchPage()" title="페이지 전환 (또는 URL 직접: ?page=1 또는 ?page=2)">PAGE 1 · 코트 1~12<span class="top-page-arrow">⇄</span></span>
    <div class="top-spacer"></div>
  </div>

  <!-- 메인 = 사이드바(좌) + 영상(우) -->
  <div id="main-area">
    <div id="sidebar">
      <!-- 토글 버튼 (수동 제어) -->
      <button id="sb-toggle" onclick="toggleSidebar()" title="사이드바 토글">◀</button>
      <!-- HEAT 정보 (항상 표시) -->
      <div class="sb-heat-section">
        <div class="sb-heat-lbl">CURRENT</div>
        <div class="sb-heat-num" id="sb-heat-num">HEAT —</div>
        <div class="sb-event" id="sb-event">—</div>
        <div class="sb-div" id="sb-div">—</div>
        <div class="sb-status-pill st-idle" id="sb-status">⏸ 대기</div>
      </div>
      <!-- 순위 / 시상등급 탭 -->
      <div class="sb-rank-section">
        <div class="sb-tabs">
          <button class="sb-tab active" id="tab-rank" onclick="switchRankMode('rank')">순위</button>
          <button class="sb-tab" id="tab-award" onclick="switchRankMode('award')">시상등급</button>
        </div>

        <!-- 순위 모드: 페이지 버튼 -->
        <div class="sb-page-btns" id="rank-page-btns">
          <button class="sb-pg active" data-page="1" onclick="setRankPage(1)">1-10</button>
          <button class="sb-pg" data-page="2" onclick="setRankPage(2)">11-20</button>
          <button class="sb-pg" data-page="3" onclick="setRankPage(3)">21-30</button>
        </div>

        <!-- 시상등급 모드: 등급 버튼 -->
        <div class="sb-page-btns" id="award-page-btns" style="display:none">
          <button class="sb-pg active" data-award="grand" onclick="setAwardTab('grand')">대상</button>
          <button class="sb-pg" data-award="gold" onclick="setAwardTab('gold')">금상</button>
          <button class="sb-pg" data-award="silver" onclick="setAwardTab('silver')">은상</button>
          <button class="sb-pg" data-award="bronze" onclick="setAwardTab('bronze')">동상</button>
        </div>

// ── 상태 ──
let peer=null;
let liveScores={};       // courtId → {name,club,score,bib}
let currentLayout='12';
let activeCourtsForPage=[]; // 현재 페이지에 표시할 코트 (12개)
let currentLayout4Courts=[];
let focusCourt=null;
let annTimer=null;
const ANN_DUR=15000;

// 페이지별 코트 분리 (코트 정렬 기준)
function getPageCourts(allCourts,page){
  const sorted=[...allCourts].sort((a,b)=>{
    const an=parseInt(a),bn=parseInt(b);
    if(!isNaN(an)&&!isNaN(bn))return an-bn;
    return String(a).localeCompare(String(b));
  });
  const start=(page-1)*12;
  return sorted.slice(start,start+12);
}

// ── 초기화 ──
function init(){
  document.getElementById('inp-room').value=config.room||'';
  document.getElementById('inp-logo').value=config.logo||'';

  if(!config.room){document.getElementById('cfg').classList.add('show');return;}

    call.answer();
    call.on('stream',stream=>{

        v.srcObject=stream;v.autoplay=true;v.playsinline=true;v.muted=true;

        if(card)card.classList.add('has-signal');
      } else {
        console.warn('[Viewer] vid-'+courtNum+' 카드 없음 (코트가 이 페이지에 없음)');
      }
    });
    call.on('error',e=>console.warn('[Viewer] call error:',e));
  };
  peer.on('call',handleCall);

  // ★ 하위 호환: 페이지 1은 옛날 ID(mop-room-viewer)로도 등록
  // → 옛날 camera.html이 호출해도 받을 수 있음
  if(currentPage===1){
    try{
      const legacyPeer=new Peer(`mop-${config.room}-viewer`);
      legacyPeer.on('open',id=>console.log('뷰어 온라인 (호환):',id));
      legacyPeer.on('call',handleCall);
      legacyPeer.on('error',e=>{
        if(e.type!=='unavailable-id')console.warn('[Viewer] legacy peer error:',e.type);
      });
    }catch(e){console.warn('[Viewer] legacy peer init failed:',e);}

  subscribeOperator();

  setTimeout(()=>{

      loadHeatInfo(heatNo);
    });

}

// ── 운영앱 구독 ──
let lastLoadedHeatNo=null; // ★ 히트 번호 변경 감지용
let lastLayout=null;       // ★ 레이아웃 변경 감지용

function subscribeOperator(){
  db.ref(`${config.room}/operator`).on('value',s=>{
    const v=s.val();if(!v)return;
    if(v.currentHeatNo){
      document.getElementById('sb-heat-num').textContent=`HEAT ${v.currentHeatNo}`;
      // ★ 히트 번호가 바뀔 때만 loadHeatInfo 호출 (영상 날아가는 버그 방지)
      if(v.currentHeatNo !== lastLoadedHeatNo){
        lastLoadedHeatNo=v.currentHeatNo;
        loadHeatInfo(v.currentHeatNo);
      }
    }
    if(v.heatStatus)updateStatus(v.heatStatus);
    else updateStatus('idle');

    // ★ 레이아웃도 실제로 바뀔 때만 setLayout 호출
    if(v.viewerLayout && v.viewerLayout !== lastLayout){
      lastLayout=v.viewerLayout;
      setLayout(v.viewerLayout,v.viewerCourts||[],v.viewerFocus||null);
    }
  });
}

function loadHeatInfo(heatNo){
  console.log(`[Viewer] loadHeatInfo(${heatNo}) - page=${currentPage}`);
  db.ref(`${config.room}/heats/heat_${heatNo}`).once('value',s=>{
    const h=s.val();
    if(!h){console.warn(`[Viewer] Heat ${heatNo} 데이터 없음`);return;}

    document.getElementById('sb-event').textContent=h.event_name||h.event||'—';
    document.getElementById('sb-div').textContent=h.division||'—';
    currentEvent=h.event_name||h.event||'';
    currentDivision=h.division||'';

    const allCourts=Object.keys(h.courts||{});
    activeCourtsForPage=getPageCourts(allCourts,currentPage);
    const courtsToShow=getCourtsForCurrentLayout();

    // ★ rebuild 전 기존 영상 스트림 저장
    const savedStreams={};
    document.querySelectorAll('.court-card').forEach(card=>{
      const cid=card.dataset.court;
      const v=card.querySelector('video');
      if(v&&v.srcObject) savedStreams[cid]=v.srcObject;
    });

    rebuildCourtCards(courtsToShow);

    // ★ rebuild 후 영상 스트림 복원
    Object.entries(savedStreams).forEach(([cid,stream])=>{
      const v=document.querySelector(`.court-card[data-court="${cid}"] video`);
      if(v){v.srcObject=stream;v.play().catch(()=>{});}
    });

    // 선수 정보 업데이트
    activeCourtsForPage.forEach(cid=>{
      const c=h.courts[cid];
      const ath=c?.athlete;
      if(!ath)return;
      const cleanName=(ath.name||'').replace(/\uFFFD/g,'').trim();
      const nameEl=document.getElementById('name-'+cid);
      const clubEl=document.getElementById('club-'+cid);
      if(nameEl)nameEl.textContent=cleanName||'—';
      if(clubEl)clubEl.textContent=ath.club||'—';
      if(!liveScores[cid])liveScores[cid]={};
      liveScores[cid].name=cleanName||'';
      liveScores[cid].club=ath.club||'';
      liveScores[cid].bib=ath.bib||'';
    });
    updateRankList();
  });
}

// 현재 레이아웃에 따라 표시할 코트 목록
function getCourtsForCurrentLayout(){
  if(currentLayout==='12'){
    return activeCourtsForPage.slice(0,12);
  } else if(currentLayout==='4'&&currentLayout4Courts.length>0){
    // 4분할: 페이지 내에서만 4개
    return currentLayout4Courts.filter(c=>activeCourtsForPage.includes(c)).slice(0,4);
  } else if(currentLayout==='1'&&focusCourt){
    return activeCourtsForPage.includes(focusCourt)?[focusCourt]:[];
  }
  return activeCourtsForPage.slice(0,12);
}

function setLayout(layout,courts,focus){
  // 페이드 아웃
  const wrap=document.getElementById('courts-wrap');
  wrap.style.opacity='0';

  setTimeout(()=>{
    currentLayout=layout;
    if(layout==='4')currentLayout4Courts=courts||[];
    if(layout==='1')focusCourt=focus;

    const courtsToShow=getCourtsForCurrentLayout();
    rebuildCourtCards(courtsToShow);
    wrap.className=`layout-${layout}`;

    // 페이드 인
    requestAnimationFrame(()=>{
      wrap.style.opacity='1';
    });
  },350);
}

// 코트 카드 재생성
function rebuildCourtCards(courtIds){
  const wrap=document.getElementById('courts-wrap');
  let maxCount=12;
  if(currentLayout==='4')maxCount=4;
  else if(currentLayout==='1')maxCount=1;
  const limited=(courtIds||[]).slice(0,maxCount);

  wrap.innerHTML='';
  if(limited.length===0){
    wrap.innerHTML='<div style="grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.25);font-family:Bebas Neue,sans-serif;letter-spacing:.2em;font-size:13px">대기 중...</div>';
    return;
  }

  limited.forEach(cid=>{
    const card=document.createElement('div');
    card.className='court-card';
    card.id='court-'+cid;
    card.dataset.court=cid;
    card.innerHTML=`
      <div class="video-wrap" id="vid-${cid}">
        <div class="no-signal">NO SIGNAL</div>
      </div>
      <div class="court-id-badge">${cid}</div>
      <div class="info-overlay">
        <div class="info-left">
          <div class="info-name" id="name-${cid}">—</div>
          <div class="info-club" id="club-${cid}">—</div>
        </div>
        <div class="info-score" id="score-${cid}">—</div>
      </div>`;
    wrap.appendChild(card);
  });
  console.log(`[Viewer] Rebuilt ${limited.length} cards:`,limited);
}

function updateStatus(state){
  const el=document.getElementById('sb-status');
  const map={
    idle:{c:'st-idle',t:'⏸ 대기'},
    calling:{c:'st-calling',t:'📢 소집'},
    racing:{c:'st-racing',t:'▶ 진행 중'},
    finished:{c:'st-finished',t:'✓ 완료'},
  };
  const s=map[state]||map.idle;
  el.className='sb-status-pill '+s.c;
  el.textContent=s.t;
  // 자동 사이드바 토글
  autoToggleSidebar(state);
}

// ── 사이드바 토글 (자동 + 수동) ──
let sbAutoMode=true;
let sbManualOverride=false;
let sbManualTimer=null;

function toggleSidebar(){
  // 수동 토글 → 30초간 자동 무시
  sbManualOverride=true;
  clearTimeout(sbManualTimer);
  sbManualTimer=setTimeout(()=>{sbManualOverride=false;console.log('[Viewer] 자동 모드 복귀');},30000);

  const sb=document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
  document.getElementById('sb-toggle').textContent=
    sb.classList.contains('collapsed')?'▶':'◀';
}

function autoToggleSidebar(state){
  if(!sbAutoMode||sbManualOverride)return;
  const sb=document.getElementById('sidebar');
  const toggle=document.getElementById('sb-toggle');
  // racing(진행 중) → 축소 (영상 집중)
  // 그 외 → 펼침 (정보 노출)
  if(state==='racing'){
    if(!sb.classList.contains('collapsed')){
      sb.classList.add('collapsed');
      if(toggle)toggle.textContent='▶';
    }
  } else {
    if(sb.classList.contains('collapsed')){
      sb.classList.remove('collapsed');
      if(toggle)toggle.textContent='◀';
    }
  }
}

// ── 심판 점수 구독 ──
function subscribeJudges(){
  db.ref(`${config.room}/monitoring/judges`).on('value',s=>{
    const judges=s.val()||{};
    Object.entries(judges).forEach(([cid,j])=>{
      const scoreEl=document.getElementById('score-'+cid);
      const sc=j.liveCount??j.score??null;
      if(scoreEl&&sc!==null){
        scoreEl.textContent=sc;
        scoreEl.classList.add('bump');
        setTimeout(()=>scoreEl.classList.remove('bump'),250);
        const card=document.getElementById('court-'+cid);
        if(card&&sc>0)card.classList.add('has-score');
      }
      if(!liveScores[cid])liveScores[cid]={};
      liveScores[cid].score=sc??0;
    });
    updateRankList();
  });
}

// ── 사이드바 순위 (FLIP 애니메이션) ──
let prevRankPositions={}; // cid → top px
// ── 시상 기준 더미 데이터 (KRSA 규정집 기반) ──
// TODO: Setup 앱에서 입력 받아서 Firebase로 동기화
const KRSA_AWARDS={
  '30초번갈아뛰기': {
    '유치부': {gold:41, silver:36, bronze:30},
    '초등1,2부': {gold:45, silver:40, bronze:35},
    '초등3,4부': {gold:56, silver:51, bronze:45},
    '초등5,6부': {gold:66, silver:61, bronze:55},
    '중등부': {gold:66, silver:61, bronze:55},
    '고등부': {gold:66, silver:61, bronze:55},
    '일반부': {gold:66, silver:61, bronze:55},
  },
  '30초이중뛰기': {
    '유치부': {gold:41, silver:36, bronze:30},
    '초등1,2부': {gold:45, silver:40, bronze:35},
    '초등3,4부': {gold:56, silver:51, bronze:45},
    '초등5,6부': {gold:66, silver:61, bronze:55},
    '중등부': {gold:66, silver:61, bronze:55},
    '고등부': {gold:66, silver:61, bronze:55},
    '일반부': {gold:66, silver:61, bronze:55},
  },
  // SR Speed (영문 종목명 매핑용)
  'Single Rope Speed Sprint': {
    '유치부': {gold:41, silver:36, bronze:30},
    '초등1,2부': {gold:45, silver:40, bronze:35},
    '초등3,4부': {gold:56, silver:51, bronze:45},
    '초등5,6부': {gold:66, silver:61, bronze:55},
    '프라이머리 남자': {gold:45, silver:40, bronze:35},
    '프라이머리 여자': {gold:45, silver:40, bronze:35},
    '주니어 남자': {gold:56, silver:51, bronze:45},
    '주니어 여자': {gold:56, silver:51, bronze:45},
    '시니어 남자': {gold:66, silver:61, bronze:55},
    '시니어 여자': {gold:66, silver:61, bronze:55},
  },
};
const GRAND_AWARD_COUNT=3; // 대상 인원 (고정)

// 현재 히트의 시상 기준 가져오기
let currentEvent='';
let currentDivision='';
function getAwardThresholds(){
  const ev=currentEvent||'';
  const div=currentDivision||'';
  if(KRSA_AWARDS[ev]&&KRSA_AWARDS[ev][div])return KRSA_AWARDS[ev][div];
  // fallback: 종목명에 부분 일치
  for(const evKey of Object.keys(KRSA_AWARDS)){
    if(ev.includes(evKey)||evKey.includes(ev)){
      if(KRSA_AWARDS[evKey][div])return KRSA_AWARDS[evKey][div];
    }
  }
  return null;
}

// 점수로 시상 등급 판정
function getAwardLevel(score,rank){
  if(rank<=GRAND_AWARD_COUNT)return 'grand'; // 대상은 순위 기준
  const t=getAwardThresholds();
  if(!t)return null;
  if(score>=t.gold)return 'gold';
  if(score>=t.silver)return 'silver';
  if(score>=t.bronze)return 'bronze';
  return null;
}

// ── 순위 모드 / 시상등급 모드 전환 ──
let rankMode='rank';      // 'rank' or 'award'
let rankPage=1;            // 1=1-10, 2=11-20, 3=21-30
let awardTab='grand';      // 'grand', 'gold', 'silver', 'bronze'

function switchRankMode(mode){
  rankMode=mode;
  document.getElementById('tab-rank').classList.toggle('active',mode==='rank');
  document.getElementById('tab-award').classList.toggle('active',mode==='award');
  document.getElementById('rank-page-btns').style.display=mode==='rank'?'flex':'none';
  document.getElementById('award-page-btns').style.display=mode==='award'?'flex':'none';
  updateRankList();
}

function setRankPage(p){
  rankPage=p;
  document.querySelectorAll('#rank-page-btns .sb-pg').forEach(b=>{
    b.classList.toggle('active',parseInt(b.dataset.page)===p);
  });
  updateRankList();
}

function setAwardTab(t){
  awardTab=t;
  document.querySelectorAll('#award-page-btns .sb-pg').forEach(b=>{
    b.classList.toggle('active',b.dataset.award===t);
  });
  updateRankList();
}

function updateRankList(){
  const list=document.getElementById('sb-rank-list');
  // 페이지 내 코트만, 점수순 정렬
  const sorted=Object.entries(liveScores)
    .filter(([cid,v])=>activeCourtsForPage.includes(cid)&&(v.name||v.score>0))
    .sort((a,b)=>(b[1].score||0)-(a[1].score||0));

  if(sorted.length===0){
    list.innerHTML='<div style="text-align:center;color:rgba(255,255,255,.3);font-size:11px;padding:30px 0">점수 대기 중...</div>';
    return;
  }

  // 모드별 필터링
  let filtered=[];
  if(rankMode==='rank'){
    // 순위 페이지: 1-10, 11-20, 21-30
    const start=(rankPage-1)*10;
    filtered=sorted.slice(start,start+10).map((e,i)=>({...e,_rank:start+i+1}));
  } else {
    // 시상등급별 필터링
    sorted.forEach((e,i)=>{
      const lv=getAwardLevel(e[1].score||0,i+1);
      if(lv===awardTab)filtered.push({...e,_rank:i+1,_level:lv});
    });
  }

  if(filtered.length===0){
    const msg=rankMode==='rank'?`${(rankPage-1)*10+1}~${rankPage*10}위 없음`:`${{grand:'대상',gold:'금상',silver:'은상',bronze:'동상'}[awardTab]} 해당자 없음`;
    list.innerHTML=`<div style="text-align:center;color:rgba(255,255,255,.3);font-size:11px;padding:30px 0">${msg}</div>`;
    return;
  }

  // 이전 위치 (FLIP)
  const prevRects={};
  list.querySelectorAll('.sb-rank-item').forEach(el=>{
    prevRects[el.dataset.cid]=el.getBoundingClientRect().top;
  });

  // DOM 생성
  const cls=['gold','silver','bronze'];
  list.innerHTML=filtered.map(item=>{
    const cid=item[0]||item.cid;
    const v=item[1]||item;
    const rk=item._rank;
    const score=v.score??0;
    const rkClass=rk<=3?cls[rk-1]:'other';
    // 시상등급 태그
    const lv=getAwardLevel(score,rk);
    const lvLabels={grand:'대상',gold:'금상',silver:'은상',bronze:'동상'};
    const lvTag=lv?`<span class="rank-award-tag rank-award-${lv}">${lvLabels[lv]}</span>`:'';
    return `<div class="sb-rank-item rank-${rk}" data-cid="${cid}">
      <span class="sb-r-num ${rkClass}">${rk}</span>
      <span class="sb-r-cid">${cid}</span>
      <div class="sb-r-info">
        <div class="sb-r-name">${v.name||'—'}${lvTag}</div>
        ${v.club?`<div class="sb-r-club">${v.club}</div>`:''}
      </div>
      <span class="sb-r-score">${score}</span>
    </div>`;
  }).join('');

  // FLIP 애니메이션
  list.querySelectorAll('.sb-rank-item').forEach(el=>{
    const cid=el.dataset.cid;
    const newTop=el.getBoundingClientRect().top;
    const oldTop=prevRects[cid];
    if(oldTop!==undefined&&Math.abs(newTop-oldTop)>1){
      const dy=oldTop-newTop;
      el.style.transform=`translateY(${dy}px)`;
      el.style.transition='none';
      requestAnimationFrame(()=>{
        el.style.transition='transform .6s cubic-bezier(.22,.68,0,1.2)';
        el.style.transform='translateY(0)';
      });
    }
  });
}

// ── 안내 방송 ──
function subscribeAnnouncements(){
  db.ref(`${config.room}/announcements/current`).on('value',s=>{
    const v=s.val();
    if(!v||!v.ts||Date.now()-v.ts>10000)return;
    showAnn(v);
  });
}
function showAnn(v){
  const ko=v.text_ko||'';const en=v.text_en||'';
  const icons={'소집':'📢','시작':'▶','수고':'🎉','폐회':'🏁','개회':'🏆'};
  const icon=Object.entries(icons).find(([k])=>ko.includes(k));
  document.getElementById('ann-icon').textContent=icon?icon[1]:'📢';
  document.getElementById('ann-text').textContent=ko;
  const enEl=document.getElementById('ann-text-en');
  enEl.textContent=en;enEl.style.display=en?'block':'none';
  const fill=document.getElementById('ann-fill');
  fill.style.transition='none';fill.style.transform='scaleX(1)';
  document.getElementById('ann-popup').style.display='block';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    fill.style.transition=`transform ${ANN_DUR}ms linear`;
    fill.style.transform='scaleX(0)';
  }));
  clearTimeout(annTimer);
  annTimer=setTimeout(()=>document.getElementById('ann-popup').style.display='none',ANN_DUR);
}

function heartbeat(){
  const path=`${config.room}/monitoring/viewer_p${currentPage}`;
  db.ref(path).update({online:true,page:currentPage,lastSeen:Date.now()});
  setInterval(()=>db.ref(path).update({online:true,page:currentPage,lastSeen:Date.now()}),5000);
}

window.onload=init;
</script>
