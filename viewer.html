<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>모두의 플레이 — 전광판</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ── 기본 초기화 ── */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;height:100%;
  background:#03050C;
  color:#fff;
  font-family:'Noto Sans KR',sans-serif;
  overflow:hidden;
}

/* ── 전체 레이아웃 ── */
#app{display:flex;flex-direction:column;width:100vw;height:100vh;}

/* ── 상단 헤더 (대회명 + 히트 + 종목) ── */
#top-bar{
  height:44px;flex-shrink:0;
  background:linear-gradient(135deg,#050D1F,#091428);
  border-bottom:1px solid rgba(0,229,255,.25);
  display:flex;align-items:center;
  padding:0 16px;gap:16px;
}
.top-comp{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;color:#00e5ff;
  letter-spacing:.06em;
  text-shadow:0 0 20px rgba(0,229,255,.4);
  white-space:nowrap;
}
.top-sep{width:1px;height:22px;background:rgba(0,229,255,.2);flex-shrink:0;}
.top-heat{
  font-family:'Bebas Neue',sans-serif;
  font-size:16px;color:#ffd60a;
  letter-spacing:.1em;white-space:nowrap;
}
.top-event{
  font-size:13px;color:rgba(255,255,255,.7);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  flex:1;
}
.top-status{
  font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;
}
.st-idle    {background:rgba(74,85,104,.3);color:#718096;}
.st-calling {background:rgba(255,214,10,.2);color:#ffd60a;}
.st-racing  {background:rgba(0,229,255,.2);color:#00e5ff;}
.st-finished{background:rgba(0,255,136,.2);color:#00ff88;}

/* 로고 영역 */
#top-logo{height:32px;object-fit:contain;opacity:.85;flex-shrink:0;}

/* ── 코트 그리드 영역 ── */
#courts-wrap{
  flex:1;min-height:0;
  display:grid;gap:3px;padding:3px;
  transition:all .4s ease;
}

/* 레이아웃 프리셋 */
.layout-12{
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(2,1fr);
}
.layout-4{
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);
}
.layout-1{
  grid-template-columns:1fr;
  grid-template-rows:1fr;
}

/* 코트 카드 */
.court-card{
  background:#080C18;
  border:1px solid rgba(255,255,255,.08);
  border-radius:3px;
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  transition:border-color .3s;
}
.court-card.has-signal{border-color:rgba(0,229,255,.2);}
.court-card.has-score{border-color:rgba(0,255,136,.3);}

/* 비디오 영역 (남은 공간 채우기) */
.video-wrap{
  flex:1;position:relative;background:#000;overflow:hidden;
}
.video-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
.no-signal{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(10px,1.5vw,16px);
  color:rgba(255,255,255,.12);letter-spacing:.2em;
}

/* 코트 ID 오버레이 */
.court-id-badge{
  position:absolute;top:5px;left:5px;z-index:3;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(14px,2vw,22px);
  color:#00e5ff;line-height:1;
  text-shadow:0 0 12px rgba(0,229,255,.7);
}

/* 하단 정보 바 */
.info-bar{
  background:rgba(0,0,0,.88);
  padding:4px 8px;
  display:flex;align-items:center;justify-content:space-between;
  gap:6px;flex-shrink:0;
}
.info-left{flex:1;min-width:0;}
.info-name{
  font-size:clamp(10px,1.4vw,15px);
  font-weight:800;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1.2;
}
.info-club{
  font-size:clamp(8px,1vw,11px);
  color:rgba(255,255,255,.5);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1.2;margin-top:1px;
}
.info-score{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(22px,4vw,52px);
  color:#00e5ff;line-height:1;
  text-shadow:0 0 16px rgba(0,229,255,.5);
  flex-shrink:0;
  transition:color .15s;
}
.info-score.bump{color:#00ff88;text-shadow:0 0 20px rgba(0,255,136,.6);}

/* 4분할 전용: 더 큰 정보 표시 */
.layout-4 .info-bar{padding:8px 14px;}
.layout-4 .info-name{font-size:clamp(14px,2vw,22px);}
.layout-4 .info-club{font-size:clamp(10px,1.2vw,14px);}
.layout-4 .info-score{font-size:clamp(40px,7vw,88px);}
.layout-4 .court-id-badge{font-size:clamp(20px,3vw,36px);}

/* 1분할 전용 */
.layout-1 .info-bar{padding:12px 20px;}
.layout-1 .info-name{font-size:clamp(18px,3vw,32px);}
.layout-1 .info-club{font-size:clamp(12px,1.5vw,18px);}
.layout-1 .info-score{font-size:clamp(60px,12vw,140px);}
.layout-1 .court-id-badge{font-size:clamp(28px,4vw,48px);}

/* ── 하단 순위 바 (고정 위치, 내용만 교체) ── */
#rank-board{
  height:40px;flex-shrink:0;
  background:#000814;
  border-top:2px solid rgba(0,229,255,.25);
  display:flex;align-items:stretch;
  overflow:hidden;position:relative;
}
.rank-tag{
  font-family:'Bebas Neue',sans-serif;font-size:12px;
  color:#00e5ff;letter-spacing:.15em;
  padding:0 12px;white-space:nowrap;
  border-right:1px solid rgba(0,229,255,.2);
  flex-shrink:0;display:flex;align-items:center;
  background:rgba(0,229,255,.05);
  gap:6px;
}
.rank-page-dot{font-size:8px;color:rgba(0,229,255,.4);}

/* 순위 콘텐츠 영역 — 두 레이어 겹쳐서 crossfade */
.rank-content-wrap{
  flex:1;position:relative;overflow:hidden;
}
.rank-layer{
  position:absolute;inset:0;
  display:flex;align-items:center;
  padding:0 4px;gap:0;
  transition:opacity .5s ease;
}
.rank-layer.visible{opacity:1;pointer-events:auto;}
.rank-layer.hidden{opacity:0;pointer-events:none;}

/* 순위 아이템 */
.rank-item{
  display:inline-flex;align-items:center;gap:6px;
  padding:0 14px;height:100%;
  border-right:1px solid rgba(255,255,255,.06);
  flex-shrink:0;white-space:nowrap;
}
.r-rank{
  font-family:'Bebas Neue',sans-serif;font-size:16px;
  line-height:1;flex-shrink:0;width:18px;text-align:center;
}
.r-rank.gold  {color:#ffd60a;}
.r-rank.silver{color:#94a3b8;}
.r-rank.bronze{color:#cd7c54;}
.r-rank.other {color:rgba(255,255,255,.3);}
.r-court{font-family:'Bebas Neue',sans-serif;font-size:12px;color:rgba(0,229,255,.6);}
.r-name{font-size:12px;font-weight:700;color:rgba(255,255,255,.85);}
.r-club{font-size:10px;color:rgba(255,255,255,.4);}
.r-score{
  font-family:'Bebas Neue',sans-serif;font-size:20px;
  color:#00e5ff;margin-left:2px;
  text-shadow:0 0 8px rgba(0,229,255,.4);
}

/* ── 안내 방송 팝업 ── */
#ann-popup{
  display:none;position:fixed;
  bottom:50px;left:50%;transform:translateX(-50%);z-index:999;
  background:rgba(3,8,25,.97);
  border:2px solid rgba(0,229,255,.7);
  border-radius:16px;padding:20px 36px;
  max-width:820px;width:92%;
  box-shadow:0 0 60px rgba(0,229,255,.25),0 0 120px rgba(0,229,255,.08);
  backdrop-filter:blur(16px);
  text-align:center;animation:annPop .4s cubic-bezier(.22,.68,0,1.2);
}
#ann-icon{font-size:26px;margin-bottom:7px;}
#ann-text{font-size:clamp(18px,3vw,26px);font-weight:700;color:#fff;line-height:1.7;letter-spacing:.02em;}
#ann-text-en{font-size:clamp(12px,1.8vw,17px);color:rgba(0,229,255,.65);margin-top:6px;font-style:italic;}
#ann-bar{height:3px;background:rgba(0,229,255,.15);border-radius:3px;margin-top:12px;overflow:hidden;}
#ann-fill{height:100%;background:linear-gradient(90deg,#00e5ff,#00ff88);transform-origin:left;transition:transform linear;}
@keyframes annPop{from{opacity:0;transform:translateX(-50%) translateY(28px) scale(.95);}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}}

/* ── 설정 모달 ── */
#cfg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;align-items:center;justify-content:center;}
#cfg.show{display:flex;}
.cfg-box{background:#0d1117;border:1px solid rgba(0,229,255,.3);border-radius:16px;padding:24px;width:380px;max-width:92vw;}
.cfg-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#00e5ff;margin-bottom:16px;text-align:center;}
.cfg-lbl{font-size:10px;color:#718096;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;margin-top:10px;}
.cfg-inp{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 14px;font-size:14px;color:#fff;font-family:monospace;}
.cfg-btn{width:100%;padding:12px;background:#00e5ff;border:none;border-radius:10px;font-size:15px;font-weight:700;color:#000;cursor:pointer;margin-top:14px;}
</style>
</head>
<body>

<!-- 설정 모달 -->
<div id="cfg">
  <div class="cfg-box">
    <div class="cfg-title">📺 전광판 설정</div>
    <div class="cfg-lbl">Room ID</div>
    <input class="cfg-inp" id="inp-room" placeholder="예: room_001">
    <div class="cfg-lbl">대회 로고 URL (선택)</div>
    <input class="cfg-inp" id="inp-logo" placeholder="https://...logo.png">
    <button class="cfg-btn" onclick="saveConfig()">저장 및 시작</button>
  </div>
</div>

<button onclick="document.getElementById('cfg').classList.add('show')"
  style="position:fixed;top:6px;right:8px;z-index:200;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.3);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;line-height:1.5;">⚙</button>

<div id="app">
  <!-- 상단 바 -->
  <div id="top-bar">
    <img id="top-logo" src="" alt="" style="display:none">
    <span class="top-comp" id="top-comp">모두의 플레이</span>
    <div class="top-sep"></div>
    <span class="top-heat" id="top-heat">HEAT —</span>
    <span class="top-event" id="top-event">—</span>
    <span class="top-status st-idle" id="top-status">⏸ 대기</span>
  </div>

  <!-- 코트 그리드 -->
  <div id="courts-wrap" class="layout-12"></div>

  <!-- 순위 바 (고정 위치, 내용 교체) -->
  <div id="rank-board">
    <div class="rank-tag">
      LIVE RANK
      <span class="rank-page-dot" id="rank-page-ind">●●●</span>
    </div>
    <div class="rank-content-wrap">
      <div class="rank-layer visible" id="rank-layer-a"></div>
      <div class="rank-layer hidden"  id="rank-layer-b"></div>
    </div>
  </div>
</div>

<!-- 안내 팝업 -->
<div id="ann-popup" onclick="this.style.display='none'">
  <div id="ann-icon">📢</div>
  <div id="ann-text"></div>
  <div id="ann-text-en"></div>
  <div id="ann-bar"><div id="ann-fill"></div></div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyDOrKZDSNiA4sLnkNBiLVehE8xtrU-2JLY",
  authDomain:"mop-jumprope.firebaseapp.com",
  databaseURL:"https://mop-jumprope-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"mop-jumprope",storageBucket:"mop-jumprope.firebasestorage.app",
  messagingSenderId:"875740425909",appId:"1:875740425909:web:59768e633b7a42733918fc"
});
const db=firebase.database();

let config=JSON.parse(localStorage.getItem('mop_viewer_v4')||'{}');
let peer=null;
let liveScores={}; // courtId → {name,club,score,bib}
let annTimer=null;
const ANN_DUR=15000;

// URL 파라미터 우선
const urlP=new URLSearchParams(window.location.search);
if(urlP.get('room'))config.room=urlP.get('room');

function saveConfig(){
  config.room=document.getElementById('inp-room').value.trim();
  config.logo=document.getElementById('inp-logo').value.trim();
  localStorage.setItem('mop_viewer_v4',JSON.stringify(config));
  location.reload();
}

// ── 레이아웃 전환 ──
let currentLayout='12';
let focusCourt=null;

function setLayout(layout, courts){
  currentLayout=layout;
  const wrap=document.getElementById('courts-wrap');
  wrap.className=`layout-${layout}`;
  // 모든 카드 숨기기 먼저
  document.querySelectorAll('.court-card').forEach(c=>c.style.display='');

  if(layout==='4'&&courts&&courts.length>0){
    // 선택된 코트 4개만 표시
    document.querySelectorAll('.court-card').forEach(c=>{
      c.style.display=courts.includes(c.dataset.court)?'':'none';
    });
  } else if(layout==='1'&&focusCourt){
    document.querySelectorAll('.court-card').forEach(c=>{
      c.style.display=c.dataset.court===focusCourt?'':'none';
    });
  }
  // 12분할은 모두 표시
}

// ── 초기화 ──
function init(){
  if(!config.room){
    if(urlP.get('room')){config.room=urlP.get('room');}
    else{document.getElementById('cfg').classList.add('show');return;}
  }

  // 로고
  if(config.logo){
    const logoEl=document.getElementById('top-logo');
    logoEl.src=config.logo;logoEl.style.display='block';
  }

  // 코트 카드 생성 (기본 display:flex — 처음에 모두 보여주고 나중에 필터)
  const wrap=document.getElementById('courts-wrap');
  const totalCourts=24;
  for(let i=1;i<=totalCourts;i++){
    const cid=String.fromCharCode(64+i); // A~X
    wrap.innerHTML+=`
      <div class="court-card" id="court-${cid}" data-court="${cid}">
        <div class="court-id-badge">${cid}</div>
        <div class="video-wrap" id="vid-${cid}">
          <div class="no-signal">NO SIGNAL</div>
        </div>
        <div class="info-bar">
          <div class="info-left">
            <div class="info-name" id="name-${cid}">—</div>
            <div class="info-club" id="club-${cid}">—</div>
          </div>
          <div class="info-score" id="score-${cid}">—</div>
        </div>
      </div>`;
  }
  // 초기엔 A~L (12개)만 표시 (히트 데이터 오기 전 기본값)
  for(let i=1;i<=totalCourts;i++){
    const cid=String.fromCharCode(64+i);
    const card=document.getElementById('court-'+cid);
    if(card)card.style.display=i<=12?'':'none';
  }

  // PeerJS 카메라 수신
  peer=new Peer('mop-'+config.room+'-viewer');
  peer.on('open',id=>console.log('뷰어 온라인:',id));
  peer.on('call',call=>{
    call.answer();
    call.on('stream',stream=>{
      const courtNum=call.peer.split('-cam-').pop();
      const box=document.getElementById('vid-'+courtNum);
      if(box){
        box.innerHTML='';
        const v=document.createElement('video');
        v.srcObject=stream;v.autoplay=true;v.playsinline=true;v.muted=true;
        box.appendChild(v);
        const card=document.getElementById('court-'+courtNum);
        if(card)card.classList.add('has-signal');
      }
    });
  });

  // Firebase 구독들
  subscribeOperator();
  subscribeJudges();
  subscribeAnnouncements();
  heartbeat();
}

// ── 운영앱 구독 (히트/종목/레이아웃/포커스코트) ──
function subscribeOperator(){
  db.ref(`${config.room}/operator`).on('value',s=>{
    const v=s.val();if(!v)return;

    // 히트/종목 표시
    if(v.currentHeatNo){
      document.getElementById('top-heat').textContent=`HEAT ${v.currentHeatNo}`;
      loadHeatInfo(v.currentHeatNo);
    }
    if(v.heatStatus)updateStatus(v.heatStatus);

    // ★ 레이아웃 제어 (운영앱에서 설정)
    if(v.viewerLayout){
      const layout=v.viewerLayout; // '12'|'4'|'1'
      const courts=v.viewerCourts||[]; // ['A','B','C','D']
      const focus=v.viewerFocus||null;
      focusCourt=focus;
      setLayout(layout,courts);
    }
  });
}

function loadHeatInfo(heatNo){
  db.ref(`${config.room}/heats/heat_${heatNo}`).once('value',s=>{
    const h=s.val();if(!h)return;
    document.getElementById('top-event').textContent=h.event_name||h.event||'—';

    // 히트에 포함된 코트들만 표시 (12분할 기준)
    if(currentLayout==='12'){
      const activeCourts=Object.keys(h.courts||{});
      document.querySelectorAll('.court-card').forEach(c=>{
        c.style.display=activeCourts.includes(c.dataset.court)?'':'none';
      });
    }

    // 코트별 선수 정보 업데이트
    Object.entries(h.courts||{}).forEach(([cid,c])=>{
      const ath=c.athlete;
      if(!ath)return;
      const nameEl=document.getElementById('name-'+cid);
      const clubEl=document.getElementById('club-'+cid);
      if(nameEl)nameEl.textContent=ath.name||'—';
      if(clubEl)clubEl.textContent=ath.club||'—';
      if(!liveScores[cid])liveScores[cid]={};
      liveScores[cid].name=ath.name||'';
      liveScores[cid].club=ath.club||'';
      liveScores[cid].bib=ath.bib||'';
    });
    updateRankBoard();
  });
}

function updateStatus(state){
  const el=document.getElementById('top-status');
  const map={
    idle:    {c:'st-idle',    t:'⏸ 대기'},
    calling: {c:'st-calling', t:'📢 소집'},
    racing:  {c:'st-racing',  t:'▶ 진행 중'},
    finished:{c:'st-finished',t:'✓ 완료'},
  };
  const s=map[state]||map.idle;
  el.className='top-status '+s.c;el.textContent=s.t;
}

// ── 심판 실시간 점수 구독 ──
function subscribeJudges(){
  db.ref(`${config.room}/monitoring/judges`).on('value',s=>{
    const judges=s.val()||{};
    Object.entries(judges).forEach(([cid,j])=>{
      const scoreEl=document.getElementById('score-'+cid);
      const sc=j.liveCount??j.score??null;
      if(scoreEl&&sc!==null){
        scoreEl.textContent=sc;
        scoreEl.classList.add('bump');
        setTimeout(()=>scoreEl.classList.remove('bump'),200);
        const card=document.getElementById('court-'+cid);
        if(card&&sc>0)card.classList.add('has-score');
      }
      if(!liveScores[cid])liveScores[cid]={};
      liveScores[cid].score=sc??0;
    });
    updateRankBoard();
  });
}

// ── 순위 바 (고정 위치, 내용만 crossfade 교체) ──
let rankData=[];
let rankPage=0;
const RANK_PER_PAGE=5;
let rankTimer=null;
let activeLayer='a';

function buildRankItems(entries){
  const cls=['gold','silver','bronze'];
  return entries.map(e=>`
    <div class="rank-item">
      <span class="r-rank ${cls[e.rank-1]||'other'}">${e.rank}</span>
      <span class="r-court">${e.cid}</span>
      <span class="r-name">${e.name||'—'}</span>
      ${e.club?`<span class="r-club">${e.club}</span>`:''}
      <span class="r-score">${e.score??'—'}</span>
    </div>`).join('');
}

function showRankPage(page){
  const totalPages=Math.max(1,Math.ceil(rankData.length/RANK_PER_PAGE));
  const p=((page%totalPages)+totalPages)%totalPages;
  const slice=rankData.slice(p*RANK_PER_PAGE,(p+1)*RANK_PER_PAGE);
  if(!slice.length)return;

  const next=activeLayer==='a'?'b':'a';
  const nextEl=document.getElementById(`rank-layer-${next}`);
  const curEl=document.getElementById(`rank-layer-${activeLayer}`);

  // 다음 레이어에 새 내용 미리 로드
  nextEl.innerHTML=buildRankItems(slice);
  // crossfade
  nextEl.classList.remove('hidden');nextEl.classList.add('visible');
  curEl.classList.remove('visible');curEl.classList.add('hidden');
  activeLayer=next;

  // 페이지 인디케이터
  const ind=document.getElementById('rank-page-ind');
  if(ind)ind.textContent='●'.repeat(totalPages).split('').map((d,i)=>i===p?'●':'○').join('');
}

function startRankCycle(){
  clearInterval(rankTimer);
  showRankPage(0);rankPage=0;
  if(rankData.length<=RANK_PER_PAGE)return; // 5개 이하면 그냥 고정
  rankTimer=setInterval(()=>{
    rankPage=(rankPage+1)%Math.ceil(rankData.length/RANK_PER_PAGE);
    showRankPage(rankPage);
  },4000);
}

function updateRankBoard(){
  const sorted=Object.entries(liveScores)
    .filter(([,v])=>v.name||v.score>0)
    .sort((a,b)=>(b[1].score||0)-(a[1].score||0))
    .map(([cid,v],i)=>({rank:i+1,cid,name:v.name||'—',club:v.club||'',score:v.score??0}));
  rankData=sorted;
  rankPage=0;
  startRankCycle();
}

// ── 안내 방송 팝업 ──
function subscribeAnnouncements(){
  db.ref(`${config.room}/announcements/current`).on('value',s=>{
    const v=s.val();
    if(!v||!v.ts||Date.now()-v.ts>10000)return;
    showAnn(v);
  });
}

function showAnn(v){
  const ko=v.text_ko||'';const en=v.text_en||'';
  const icons={'소집':'📢','시작':'▶','수고':'🎉','폐회':'🏁','개회':'🏆'};
  const icon=Object.entries(icons).find(([k])=>ko.includes(k));
  document.getElementById('ann-icon').textContent=icon?icon[1]:'📢';
  document.getElementById('ann-text').textContent=ko;
  const enEl=document.getElementById('ann-text-en');
  enEl.textContent=en;enEl.style.display=en?'block':'none';
  const fill=document.getElementById('ann-fill');
  fill.style.transition='none';fill.style.transform='scaleX(1)';
  document.getElementById('ann-popup').style.display='block';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    fill.style.transition=`transform ${ANN_DUR}ms linear`;
    fill.style.transform='scaleX(0)';
  }));
  clearTimeout(annTimer);
  annTimer=setTimeout(()=>document.getElementById('ann-popup').style.display='none',ANN_DUR);
}

// ── Heartbeat ──
function heartbeat(){
  db.ref(`${config.room}/monitoring/viewer`).update({online:true,lastSeen:Date.now()});
  setInterval(()=>db.ref(`${config.room}/monitoring/viewer`).update({online:true,lastSeen:Date.now()}),5000);
}

window.onload=init;
</script>
